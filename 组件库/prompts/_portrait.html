<!--
  光线词条共用的舞台：一面墙前的半身像，560×350。
  不加任何光线时是平淡的「平光」；词条只给 .fx 这几层写样式（墙上的光、头/脖子/身体上的明暗、伦勃朗三角光 .patch、轮廓光 .rim），
  舞台会让它们循环淡入淡出，先看平光、再看加上这个词以后的样子。
  右上角俯视布光图：橘色是光源，--la 是光源角度（0 在人背后，-90 在左边，180 在镜头这边），--lw 是光源宽度（窗户这类大光源写 3 左右）。
-->

  <div class="body"><div class="fx b-fx"></div></div>
  <div class="neck"><div class="fx n-fx"></div></div>
  <div class="head">
    <i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i>
    <div class="hair"></div>
    <div class="fx h-fx"></div>
    <div class="fx patch"></div>
    <div class="fx rim"></div>
  </div>
  <div class="tag"><span class="a">平光 · 没写光线</span><span class="b">加上这个词</span></div>

  </svg></div>
</div>
