<style>
.blog { --a: #B23A2E; --a2: #8E877C; --line: transparent; --avb: #EEE9DF; --avf: #B9B0A2; background: #F8F6F1; color: #33302B; font-family: "FangSong", "STFangsong", "Songti SC", "STSong", "Noto Serif SC", Georgia, serif; font-weight: 300; }
.logo i { display: none; } .cta { border: 0; color: #8E877C; }
.me { grid-template-columns: 60px minmax(0, 1fr) 60px; padding: 18px 46px 30px; align-items: start; } .intro { display: contents; }
.me h1 { grid-column: 3; grid-row: 1 / span 3; width: 1em; font-size: 28px; line-height: 1.45; word-break: break-all; justify-self: center; font-weight: 300; position: relative; }
.me h1::after { content: "舟"; position: absolute; top: 2px; left: -30px; width: 22px; height: 22px; display: grid; place-items: center; font-size: 12px; line-height: 1; color: #fff; background: #B23A2E; border-radius: 3px; }
.av { width: 52px; grid-row: 1; } .hi, .bio, .tags { grid-column: 2; } .hi { letter-spacing: 6px; } .bio { font-size: 13px; line-height: 2.2; max-width: 300px; } .tags span { background: none; color: #8E877C; }
.posts { padding: 0 46px 20px; } .posts h2 { opacity: .5; letter-spacing: 8px; } .posts article { grid-template-columns: 1fr auto; border: 0; padding: 8px 0; }
.posts time { grid-column: 2; grid-row: 1; } .posts p, .posts em { display: none; } .posts h3 { font-size: 15px; font-weight: 300; letter-spacing: 2px; }
.now { background: none; text-align: center; letter-spacing: 2px; } .now b { color: #B23A2E; }
</style>
