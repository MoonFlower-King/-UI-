<!--
  运镜 / 景别共用的舞台：夜色江边，一个提灯的人。560×350 画布，坐标原点在画面正中。
  分五层，离摄影机由远到近：天空（--d:10000）、远山与江面（40）、对岸与小船（16）、人物（8）、前景芦苇（4）。
  每层按「离摄影机多远」自动算出放大和位移，所以只要在词条里给 .scene 写关键帧、改下面几个摄影机变量，
  近的层动得多、远的层动得少，视差就自然出来了：
    --x 横移（像素）  --y 升降（向上为正）  --z 前后推拉（正数是向前）  --fov 变焦倍数（1 为标准）
    --pan 左右摇  --tilt 上下摇  --orb 绕人物环绕的角度（度）
  这几个变量在 assets/prompts.css 里用 @property 登记成数字，关键帧里才能平滑过渡。
  右上角是俯视机位图：橘点是人物，金色是摄影机和它看到的范围。
-->
<div class="scene">
  <div class="cam">
    <div class="ly" style="--d:10000"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset=".42" stop-color="#121a2e"/><stop offset=".53" stop-color="#2a3352"/><stop offset=".53" stop-color="#0d1424"/><stop offset="1" stop-color="#070b14"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#FFE7B8" stop-opacity=".5"/><stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/></radialGradient></defs>
      <rect x="-900" y="-500" width="1800" height="1000" fill="url(#sky)"/>
      <circle cx="-150" cy="-104" r="70" fill="url(#glow)"/><circle cx="-150" cy="-104" r="15" fill="#FFF1D2"/>
      <g fill="#E9E2D0" opacity=".7"><circle cx="-260" cy="-130" r="1.1"/><circle cx="-90" cy="-160" r=".9"/><circle cx="40" cy="-60" r=".8"/><circle cx="290" cy="-150" r="1"/><circle cx="-380" cy="-60" r=".8"/><circle cx="380" cy="-40" r=".9"/><circle cx="-170" cy="-30" r=".7"/><circle cx="520" cy="-120" r="1"/><circle cx="-540" cy="-150" r="1"/></g>
    </svg></div>
    <div class="ly" style="--d:40"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <path d="M-900 20 L-900 -18 C-760 -40 -660 -10 -560 -30 C-450 -52 -380 -8 -260 -22 C-160 -34 -120 -6 -40 -12 L-900 20Z" fill="#1d2640"/>
      <path d="M-900 20 C-700 4 -600 -6 -470 2 C-330 10 -260 -26 -150 -16 C-30 -6 60 -40 180 -30 C300 -20 380 -50 520 -26 C640 -6 760 -20 900 -8 L900 20Z" fill="#161e33"/>
      <rect x="-900" y="20" width="1800" height="480" fill="#0c1323"/>
      <g class="shim" fill="#FFE2A8"><rect x="-172" y="30" width="44" height="1.6" rx=".8"/><rect x="-162" y="40" width="26" height="1.4" rx=".7"/><rect x="-178" y="52" width="52" height="1.6" rx=".8"/><rect x="-160" y="66" width="22" height="1.4" rx=".7"/><rect x="-170" y="80" width="40" height="1.6" rx=".8"/></g>
    </svg></div>
    <div class="ly" style="--d:16"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <path d="M900 30 C600 22 420 26 300 22 C260 20 230 24 200 30 L900 30Z" fill="#0f1628"/>
      <g fill="#0f1628"><rect x="226" y="2" width="3" height="22"/><rect x="260" y="2" width="3" height="22"/><path d="M212 4 L244 -10 L276 4Z"/><path d="M220 -8 L244 -20 L268 -8Z"/></g>
      <path d="M-250 44 Q-220 52 -186 44 L-192 50 Q-220 56 -244 50Z" fill="#0a101d"/><rect x="-214" y="34" width="1.4" height="12" fill="#0a101d"/>
      <circle cx="-209" cy="38" r="2.2" fill="#FA8C16"/><circle cx="-209" cy="38" r="8" fill="#FA8C16" opacity=".22"/>
    </svg></div>
    <div class="ly" style="--d:8"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <defs><radialGradient id="lamp"><stop offset="0" stop-color="#FFB65C" stop-opacity=".55"/><stop offset="1" stop-color="#FA8C16" stop-opacity="0"/></radialGradient></defs>
      <path d="M-900 112 C-600 100 -300 116 -120 100 C-60 94 -40 90 0 91 C40 92 70 96 130 104 C300 118 600 104 900 110 L900 500 L-900 500Z" fill="#090d18"/>
      <circle cx="16" cy="50" r="46" fill="url(#lamp)"/>
      <path d="M-9 15 C-12 40 -16 70 -18 92 L18 92 C15 70 12 40 9 15 C5 12 -5 12 -9 15Z" fill="#05070d"/>
      <path d="M-9 15 C-12 40 -15 70 -18 92" stroke="#FFE6B0" stroke-width="1.1" fill="none" opacity=".75"/>
      <path d="M7 20 L15 44" stroke="#05070d" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="4" r="7" fill="#05070d"/><circle cx="-2.5" cy="-3.5" r="3.4" fill="#05070d"/>
      <path d="M-3.5 -2 A7 7 0 0 0 -6 9" stroke="#FFE6B0" stroke-width="1" fill="none" opacity=".8"/>
      <path d="M4 7 A6 6 0 0 1 1 10.5" stroke="#FFB65C" stroke-width="1" fill="none" opacity=".7"/>
      <path d="M15 44 L16 48" stroke="#2a2018" stroke-width="1"/>
      <rect x="12.5" y="48" width="7" height="9" rx="2.5" fill="#FA8C16"/><rect x="14" y="49.5" width="4" height="6" rx="1.5" fill="#FFD58A"/>
    </svg></div>
    <div class="ly fg" style="--d:4"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <path d="M-900 168 C-500 150 -300 172 -100 166 C100 160 300 176 500 162 C700 150 800 164 900 160 L900 500 L-900 500Z" fill="#04060b"/>
      <g class="reed" stroke="#04060b" stroke-width="2.4" fill="none" stroke-linecap="round" style="transform-origin:-260px 170px">
        <path d="M-300 170 C-302 140 -296 110 -284 84"/><path d="M-270 170 C-268 136 -262 112 -250 96"/><path d="M-240 170 C-246 140 -252 118 -262 104"/><path d="M-330 170 C-330 150 -334 130 -344 116"/>
        <ellipse cx="-283" cy="80" rx="2.6" ry="9" fill="#04060b" transform="rotate(20 -283 80)"/><ellipse cx="-249" cy="92" rx="2.4" ry="8" fill="#04060b" transform="rotate(26 -249 92)"/><ellipse cx="-263" cy="100" rx="2.2" ry="7" fill="#04060b" transform="rotate(-24 -263 100)"/>
      </g>
      <g class="reed r2" stroke="#04060b" stroke-width="2.4" fill="none" stroke-linecap="round" style="transform-origin:270px 166px">
        <path d="M250 166 C248 136 254 116 264 100"/><path d="M280 166 C282 140 290 120 302 108"/><path d="M308 166 C310 150 316 136 326 126"/>
        <ellipse cx="265" cy="96" rx="2.4" ry="8" fill="#04060b" transform="rotate(24 265 96)"/><ellipse cx="303" cy="104" rx="2.2" ry="7" fill="#04060b" transform="rotate(34 303 104)"/>
      </g>
    </svg></div>
  </div>
  <div class="cut"></div>
  <div class="vf"><i></i><i></i><i></i><i></i><b>REC</b></div>
  <div class="map"><span>俯视机位</span><svg viewBox="0 0 120 90">
    <path d="M6 9 H114" stroke="#8C93A8" stroke-width="1" stroke-dasharray="3 3"/><text x="8" y="19">远山</text>
    <circle cx="20" cy="56" r="2" fill="#5D6680"/><circle cx="102" cy="56" r="2" fill="#5D6680"/>
    <circle cx="60" cy="34" r="4" fill="#FA8C16"/>
    <path d="M113 42 V82" stroke="#3A4258" stroke-width="2" stroke-linecap="round"/><circle class="hgt" cx="113" cy="74" r="2.6" fill="#FFD58A"/>
    <g class="rig"><path class="fr" d="M60 78 L42 46 L78 46Z" fill="#FFD58A" opacity=".22"/><rect x="55.5" y="76" width="9" height="7" rx="1.6" fill="#FFD58A"/></g>
  </svg></div>
</div>

<style>
.scene { position: absolute; inset: 0; overflow: hidden; background: #070b16; }
.scene { position: absolute; inset: 0; }
/* 透视投影：离得越近（--d 越小）放大越多、位移越大 */
.ly { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
  --k: calc(var(--fov) / (var(--d) - var(--z)));
  transform: translate(
    calc((var(--x) * -8 * var(--k) - var(--pan) * var(--fov) - var(--orb) * (1 - 8 / var(--d)) * 6 * var(--fov)) * 1px),
    calc((var(--y) * 8 * var(--k) - var(--tilt) * var(--fov)) * 1px))
    scale(calc(var(--k) * var(--d))); }
.ly svg { position: absolute; overflow: visible; }
.shim rect { animation: shim 3.2s ease-in-out infinite alternate; }
.shim rect:nth-child(2n) { animation-delay: -1.6s; }
@keyframes shim { from { opacity: .15; } to { opacity: .6; } }
.reed { animation: sway 5s ease-in-out infinite alternate; }
.reed.r2 { animation-delay: -2.5s; }
@keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2.5deg); } }
/* 每次循环开头淡入、结尾淡出，像剪辑点 */
.cut { position: absolute; inset: 0; background: #05070d; opacity: 0; pointer-events: none; animation: cut 7s linear infinite; }
@keyframes cut { 0% { opacity: 1; } 5%, 93% { opacity: 0; } 100% { opacity: 1; } }
.vf i { position: absolute; width: 14px; height: 14px; border: 0 solid rgba(255, 241, 210, .55); }
.vf i:nth-child(1) { left: 14px; top: 14px; border-width: 1.5px 0 0 1.5px; }
.vf i:nth-child(2) { right: 14px; top: 14px; border-width: 1.5px 1.5px 0 0; }
.vf i:nth-child(3) { left: 14px; bottom: 14px; border-width: 0 0 1.5px 1.5px; }
.vf i:nth-child(4) { right: 14px; bottom: 14px; border-width: 0 1.5px 1.5px 0; }
.vf b { position: absolute; left: 24px; bottom: 20px; font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: 1px; color: rgba(255, 241, 210, .7); }
.vf b::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: #F5483B; animation: rec 1.4s steps(2, jump-none) infinite; }
@keyframes rec { 50% { opacity: .2; } }
.map { position: absolute; right: 12px; top: 12px; width: 176px; padding: 6px 6px 2px; border-radius: 10px; background: rgba(10, 14, 24, .78); border: 1px solid rgba(255, 255, 255, .1); }
.map span { display: block; margin: 0 0 2px 4px; font: 600 14px/1.4 -apple-system, "PingFang SC", sans-serif; color: rgba(237, 233, 226, .75); }
.map svg { display: block; width: 100%; height: auto; overflow: hidden; }
.map text { font: 9px -apple-system, "PingFang SC", sans-serif; fill: #8C93A8; }
.rig { transform-origin: 60px 78px;
  transform: translate(calc(var(--x) * .12px + sin(var(--orb) * 1deg) * 44px), calc(var(--z) * -5.5px + (cos(var(--orb) * 1deg) - 1) * 44px))
    rotate(calc(var(--pan) * .15deg - var(--orb) * 1deg)); }
.fr { transform-origin: 60px 78px; transform: scaleX(calc(1 / var(--fov))); }
.hgt { transform: translateY(calc(var(--y) * -.6px)); }
</style>
