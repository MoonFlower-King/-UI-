<!--
  运镜 / 景别共用的舞台：晴天的草地上站着一个穿橘色外套的人。560×350 画布，坐标原点在画面正中。
  画面刻意做得干净明亮：整幅只有人物是彩色的，远山、树、前景草由浅到深分成清楚的几层，镜头一动，哪层动得多一眼就看出来。
  分五层，离摄影机由远到近：天空（--d:10000）、远山（40）、树和小屋（16）、人物（8）、前景草丛（4）。
  每层按「离摄影机多远」自动算出放大和位移，所以只要在词条里给 .scene 写关键帧、改下面几个摄影机变量，
  近的层动得多、远的层动得少，视差就自然出来了：
    --x 横移（像素）  --y 升降（向上为正）  --z 前后推拉（正数是向前）  --fov 变焦倍数（1 为标准）
    --pan 左右摇  --tilt 上下摇  --orb 绕人物环绕的角度（度）
  这几个变量在 assets/prompts.css 里用 @property 登记成数字，关键帧里才能平滑过渡。
  右上角是俯视机位图：橘点是人物，深色是摄影机，浅橘色扇形是它看到的范围。
-->
<div class="scene">
  <div class="cam">
    <div class="ly" style="--d:10000"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE0EA"/><stop offset=".52" stop-color="#F4EFE4"/><stop offset="1" stop-color="#F4EFE4"/></linearGradient>
        <radialGradient id="sun"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFF6DF"/><stop offset="1" stop-color="#FFF6DF" stop-opacity="0"/></radialGradient></defs>
      <rect x="-900" y="-500" width="1800" height="1000" fill="url(#sky)"/>
      <circle cx="-170" cy="-96" r="60" fill="url(#sun)"/>
      <g fill="#FFFFFF" opacity=".85"><ellipse cx="120" cy="-120" rx="46" ry="11"/><ellipse cx="150" cy="-130" rx="26" ry="12"/><ellipse cx="-420" cy="-80" rx="40" ry="9"/><ellipse cx="420" cy="-60" rx="34" ry="8"/></g>
    </svg></div>
    <div class="ly" style="--d:40"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <path d="M-900 22 L-900 -14 C-760 -44 -660 -6 -540 -32 C-430 -56 -360 -8 -240 -24 C-140 -36 -100 -4 -20 -10 L-20 22Z" fill="#C8D5DE"/>
      <path d="M-900 22 C-700 6 -600 -4 -470 4 C-330 12 -260 -24 -150 -14 C-30 -4 60 -40 180 -30 C300 -20 380 -52 520 -26 C640 -6 760 -20 900 -8 L900 22Z" fill="#B3C4CF"/>
      <rect x="-900" y="20" width="1800" height="480" fill="#E5E6D4"/>
    </svg></div>
    <div class="ly" style="--d:16"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <rect x="-900" y="30" width="1800" height="470" fill="#DDDFC9"/>
      <g fill="#8B9C92"><rect x="-333" y="6" width="4" height="26"/><rect x="-262" y="10" width="4" height="22"/><rect x="-206" y="2" width="4" height="30"/><rect x="238" y="8" width="4" height="24"/><rect x="306" y="4" width="4" height="28"/><rect x="372" y="10" width="4" height="22"/></g>
      <g fill="#9FBBAA"><ellipse cx="-331" cy="-6" rx="17" ry="22"/><ellipse cx="-260" cy="0" rx="14" ry="17"/><ellipse cx="-204" cy="-14" rx="18" ry="25"/><ellipse cx="240" cy="-4" rx="15" ry="19"/><ellipse cx="308" cy="-12" rx="18" ry="24"/><ellipse cx="374" cy="0" rx="13" ry="16"/></g>
      <rect x="140" y="12" width="44" height="22" fill="#F7F4EE"/><path d="M134 13 L162 -4 L190 13Z" fill="#7F93A2"/><rect x="156" y="20" width="9" height="14" fill="#9AA9B4"/>
    </svg></div>
    <div class="ly" style="--d:8"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <path d="M-900 104 C-600 96 -300 108 -120 98 C-60 94 -30 92 0 92 C40 92 70 96 130 102 C300 112 600 100 900 106 L900 500 L-900 500Z" fill="#EAE2D0"/>
      <ellipse cx="0" cy="93" rx="22" ry="3.5" fill="#000" opacity=".1"/>
      <g fill="#3A4150"><rect x="-6.5" y="60" width="5" height="32" rx="2"/><rect x="1.5" y="60" width="5" height="32" rx="2"/></g>
      <path d="M-10 17 C-13 34 -14 52 -13 66 L13 66 C14 52 13 34 10 17 C6 13 -6 13 -10 17Z" fill="#FA8C16"/>
      <path d="M-10 18 L-15 52" stroke="#E37A08" stroke-width="4.5" stroke-linecap="round"/><path d="M10 18 L15 52" stroke="#E37A08" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-15" cy="54" r="2.4" fill="#EFCDB0"/><circle cx="15" cy="54" r="2.4" fill="#EFCDB0"/>
      <rect x="-2.5" y="9" width="5" height="6" fill="#E6BE9E"/>
      <circle cx="0" cy="4" r="7" fill="#EFCDB0"/>
      <path d="M-7.2 3.5 C-7.6 -4 -3.5 -7.4 0 -7.4 C4.2 -7.4 7.6 -4 7.2 3 C6 0 3 -2 -1 -1.6 C-4 -1.4 -6 1 -7.2 3.5Z" fill="#2E2622"/>
      <circle cx="-2.5" cy="4.2" r=".75" fill="#2E2622"/><circle cx="2.5" cy="4.2" r=".75" fill="#2E2622"/>
      <path d="M-1.6 7.2 Q0 8.3 1.6 7.2" stroke="#B5675A" stroke-width=".6" fill="none" stroke-linecap="round"/>
    </svg></div>
    <div class="ly" style="--d:4"><svg width="1800" height="1000" viewBox="-900 -500 1800 1000" style="left:-900px;top:-500px">
      <path d="M-900 166 C-500 152 -300 170 -100 165 C100 160 300 174 500 162 C700 152 800 164 900 160 L900 500 L-900 500Z" fill="#D7CDB6"/>
      <g class="reed" fill="#6F8E7B" style="transform-origin:-270px 168px">
        <path d="M-330 170 C-336 140 -340 120 -352 104 C-334 118 -324 140 -318 170Z"/><path d="M-300 170 C-300 134 -292 108 -278 88 C-284 112 -286 140 -286 170Z"/>
        <path d="M-272 170 C-266 140 -256 124 -238 112 C-252 128 -258 148 -260 170Z"/><path d="M-250 170 C-252 150 -262 136 -276 128 C-258 134 -246 150 -240 170Z"/>
      </g>
      <g class="reed r2" fill="#6F8E7B" style="transform-origin:280px 164px">
        <path d="M252 166 C250 136 256 116 268 98 C264 120 264 142 266 166Z"/><path d="M282 166 C286 142 296 124 312 112 C300 130 294 148 294 166Z"/><path d="M310 166 C314 152 322 140 336 132 C326 146 322 156 322 166Z"/>
      </g>
    </svg></div>
  </div>
  <div class="cut"></div>
  <div class="vf"><i></i><i></i><i></i><i></i><b>REC</b></div>
  <div class="map"><span>俯视机位</span><svg viewBox="0 0 120 90">
    <path d="M6 9 H114" stroke="#B3C4CF" stroke-width="1.5" stroke-dasharray="3 3"/><text x="8" y="19">远山</text>
    <circle cx="20" cy="56" r="2.4" fill="#6F8E7B"/><circle cx="102" cy="56" r="2.4" fill="#6F8E7B"/>
    <g class="rig"><path class="fr" d="M60 78 L42 46 L78 46Z" fill="#FA8C16" opacity=".18"/><rect x="55.5" y="76" width="9" height="7" rx="1.6" fill="#2A2622"/></g>
    <circle cx="60" cy="34" r="4.2" fill="#FA8C16"/>
    <path d="M113 42 V82" stroke="#E2DCD0" stroke-width="2" stroke-linecap="round"/><circle class="hgt" cx="113" cy="74" r="2.6" fill="#2A2622"/>
  </svg></div>
</div>

<style>
.scene { position: absolute; inset: 0; overflow: hidden; background: #F4EFE4; }
/* 透视投影：离得越近（--d 越小）放大越多、位移越大 */
.ly { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
  --k: calc(var(--fov) / (var(--d) - var(--z)));
  transform: translate(
    calc((var(--x) * -8 * var(--k) - var(--pan) * var(--fov) - var(--orb) * (1 - 8 / var(--d)) * 6 * var(--fov)) * 1px),
    calc((var(--y) * 8 * var(--k) - var(--tilt) * var(--fov)) * 1px))
    scale(calc(var(--k) * var(--d))); }
.ly svg { position: absolute; overflow: visible; }
.reed { animation: sway 5s ease-in-out infinite alternate; }
.reed.r2 { animation-delay: -2.5s; }
@keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2.5deg); } }
/* 每次循环开头淡入、结尾淡出，像剪辑点 */
.cut { position: absolute; inset: 0; background: #F7F3EC; opacity: 0; pointer-events: none; animation: cut 7s linear infinite; }
@keyframes cut { 0% { opacity: 1; } 5%, 93% { opacity: 0; } 100% { opacity: 1; } }
.vf i { position: absolute; width: 14px; height: 14px; border: 0 solid rgba(42, 38, 34, .45); }
.vf i:nth-child(1) { left: 14px; top: 14px; border-width: 1.5px 0 0 1.5px; }
.vf i:nth-child(2) { right: 14px; top: 14px; border-width: 1.5px 1.5px 0 0; }
.vf i:nth-child(3) { left: 14px; bottom: 14px; border-width: 0 0 1.5px 1.5px; }
.vf i:nth-child(4) { right: 14px; bottom: 14px; border-width: 0 1.5px 1.5px 0; }
.vf b { position: absolute; left: 24px; bottom: 20px; font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: 1px; color: rgba(42, 38, 34, .6); }
.vf b::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: #F5483B; animation: rec 1.4s steps(2, jump-none) infinite; }
@keyframes rec { 50% { opacity: .2; } }
.map { position: absolute; right: 12px; top: 12px; width: 176px; padding: 6px 6px 2px; border-radius: 10px; background: rgba(255, 255, 255, .9); border: 1px solid #E2DCD0; box-shadow: 0 4px 14px rgba(40, 30, 15, .08); }
.map span { display: block; margin: 0 0 2px 4px; font: 600 14px/1.4 -apple-system, "PingFang SC", sans-serif; color: #5B544A; }
.map svg { display: block; width: 100%; height: auto; overflow: hidden; }
.map text { font: 9px -apple-system, "PingFang SC", sans-serif; fill: #8C867B; }
.rig { transform-origin: 60px 78px;
  transform: translate(calc(var(--x) * .12px + sin(var(--orb) * 1deg) * 44px), calc(var(--z) * -5.5px + (cos(var(--orb) * 1deg) - 1) * 44px))
    rotate(calc(var(--pan) * .15deg - var(--orb) * 1deg)); }
.fr { transform-origin: 60px 78px; transform: scaleX(calc(1 / var(--fov))); }
.hgt { transform: translateY(calc(var(--y) * -.6px)); }
</style>
