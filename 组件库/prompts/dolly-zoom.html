<style>
.scene { animation: dolly-zoom 7s cubic-bezier(.45, .05, .35, 1) infinite; }
/* 人物大小 = --fov × 8 ÷ (8 − --z)，两者按同样节奏变化，人物就不变 */
@keyframes dolly-zoom { 0%, 10% { --z: 2; --fov: .75; } 80%, 100% { --z: -6; --fov: 1.75; } }
</style>
