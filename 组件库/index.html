<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home"><span class="mark" aria-hidden="true"></span><span><span>江月 <b>UI</b></span></span></a>
  <button class="icon-btn" id="menu-btn" aria-label="打开目录">☰</button>
</header>

<aside class="side" id="side">
  <a class="brand" href="#home"><span class="mark" aria-hidden="true"></span><span><span>江月 <b>UI</b></span><small>给 AI 描述界面的词典</small></span></a>
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="搜词或说感觉…" aria-label="搜索术语"><kbd>/</kbd></label>
  <nav class="nav" id="nav"></nav>
  <footer class="side-foot">
    <button class="icon-btn" id="theme-btn" aria-label="切换明暗"></button>

  </footer>

<div class="scrim" id="scrim"></div>

<main class="main" id="main"></main>

<button class="basket-fab" id="basket-fab" hidden><span>提示词篮子</span><b id="basket-count">0</b></button>
<div class="basket" id="basket" hidden>
  <div class="basket-panel" role="dialog" aria-label="提示词篮子">
    <header><h2>提示词篮子</h2><button class="icon-btn" id="basket-close" aria-label="关闭">✕</button></header>
    <p class="muted">挑几个词放进来，自动拼成一段完整的提示词，一次发给 AI。</p>
    <ul id="basket-list"></ul>
    <textarea id="basket-text" rows="9" aria-label="拼好的提示词"></textarea>
    <div class="row"><button class="btn ghost" id="basket-clear">清空</button><button class="btn primary" id="basket-copy">复制整段提示词</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="data/components.js"></script>
<script src="assets/app.js"></script>
