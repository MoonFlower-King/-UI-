  "vague": ["标题想有点互动", "鼠标扫过字会动"],

}

<h2 class="lh" aria-label="江上明月共潮生">江上明月共潮生</h2>

<style>
.lh { margin: 0; font: 800 44px/1.2 "Songti SC", "Noto Serif SC", serif; color: #18181B; cursor: default; user-select: none; }
.lh span { display: inline-block; transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), color .2s; }
.lh span:hover { transform: translateY(-10px) scale(1.1); color: #FA8C16; }
.lh span:has(+ span:hover), .lh span:hover + span { transform: translateY(-4px); }
</style>

<script>
const h = document.querySelector(".lh");
h.innerHTML = [...h.textContent].map((c) => `<span aria-hidden="true">${c}</span>`).join("");
</script>
