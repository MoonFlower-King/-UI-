<!--
{
  "en": "Profile Card", "zh": "个人名片卡",
  "lead": "头像、名字、一句简介、三个数字、一个关注按钮。顶部一条渐变封面，头像压在封面边上。点关注会变成“已关注”，粉丝数跟着 +1。",
  "vague": ["个人主页卡片", "用户信息怎么排"],
  "terms": ["Avatar", "Cover 封面", "Stats Row 数据行", "Follow Button 关注按钮"],
  "prompt": "做 Profile Card：宽 280px 白卡圆角 18px；顶部 72px 渐变封面（暖金到江月橘）；72px 圆形头像带 4px 白描边、一半压在封面上；名字 18px 粗体 + 灰色 @账号 + 一行简介；中间三列数据（作品/粉丝/获赞），数字粗体等宽；底部满宽关注按钮，点击后变灰色描边“已关注”，粉丝数 +1 并轻微弹跳。"
}
-->
<div class="pc">
  <div class="cover"></div>
  <div class="av">江</div>
  <h3>江小月</h3><p class="at">@jiangyue · 界面设计师</p>
  <p class="bio">把好看的界面，翻译成一句话。</p>
  <div class="nums"><div><b>128</b>作品</div><div><b class="fans">3,406</b>粉丝</div><div><b>2.1万</b>获赞</div></div>
  <button class="follow">+ 关注</button>
</div>

<style>
.pc { width: 260px; background: #fff; border-radius: 18px; overflow: hidden; text-align: center; padding-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.08); }
.cover { height: 72px; background: linear-gradient(120deg, #FDE68A, #FA8C16); }
.av { width: 68px; height: 68px; margin: -34px auto 0; border-radius: 50%; border: 4px solid #fff; background: #1E293B; color: #FDE68A; display: grid; place-items: center; font: 600 24px serif; }
h3 { margin: 8px 0 0; font-size: 17px; } .at { margin: 2px 0 0; color: #A1A1AA; font-size: 12px; }
.bio { margin: 8px 20px 0; font-size: 13px; color: #52525B; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px 16px; font-size: 11px; color: #71717A; }
.nums div + div { border-left: 1px solid #F0F0F2; }
.nums b { display: block; font-size: 16px; color: #18181B; font-variant-numeric: tabular-nums; }
.follow { width: calc(100% - 32px); height: 38px; border-radius: 10px; border: 1px solid #FA8C16; background: #FA8C16; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
.follow.on { background: #fff; color: #71717A; border-color: #E4E4E7; font-weight: 400; }
.pop { animation: pop .35s cubic-bezier(.34,1.6,.64,1); } @keyframes pop { 50% { transform: scale(1.25); color: #FA8C16; } }
</style>
<script>
const btn = document.querySelector(".follow"), fans = document.querySelector(".fans"); let n = 3406;
btn.addEventListener("click", () => {
  const on = btn.classList.toggle("on"); n += on ? 1 : -1;
  btn.textContent = on ? "已关注" : "+ 关注"; fans.textContent = n.toLocaleString();
  fans.classList.remove("pop"); void fans.offsetWidth; fans.classList.add("pop");
});
</script>
