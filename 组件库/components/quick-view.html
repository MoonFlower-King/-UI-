<!--
{
  "en": "Quick View", "zh": "快速预览",
  "lead": "在商品列表里悬停卡片会出现“快速预览”按钮，点开一个浮层就能看大图、选规格、加购物车，不用跳到详情页再返回。逛得快，也不丢失列表位置。",
  "vague": ["每次看商品都要跳页", "返回列表又从头开始"],
  "terms": ["Quick View", "Modal Preview 浮层预览", "In-context Action 原地操作"],
  "prompt": "商品网格卡片悬停时底部滑出半透明黑条“快速预览”；点击后从卡片位置放大出一个 520px 宽浮层：左侧大图，右侧品名、价格、颜色圆点选择、数量步进器和江月橘“加入购物车”按钮；背景加 40% 黑色遮罩，Esc 或点遮罩关闭，关闭后焦点回到原卡片。"
}
-->
<div class="qv">
  <div class="cards"></div>
  <div class="mask" hidden><div class="dlg" role="dialog" aria-label="快速预览"><div class="img"></div><div class="info"><b>月白陶瓷杯</b><span class="price">¥ 68</span><div class="dots"><i class="on" style="background:#F5F0E6"></i><i style="background:#FA8C16"></i><i style="background:#3F3F46"></i></div><button class="add">加入购物车</button></div><button class="x" aria-label="关闭">×</button></div></div>
</div>
<style>
.qv { position: relative; width: 320px; height: 300px; padding: 14px; box-sizing: border-box; background: #FAFAFA; border-radius: 14px; overflow: hidden; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { position: relative; border-radius: 10px; background: #fff; border: 1px solid #E4E4E7; overflow: hidden; font-size: 11px; color: #3F3F46; }
.card .ph { aspect-ratio: 1; }
.card p { margin: 6px 8px 8px; }
.card button { position: absolute; left: 0; right: 0; top: calc(100% - 52px); transform: translateY(24px); opacity: 0; border: 0; padding: 6px; background: rgba(24,24,27,.82); color: #fff; font-size: 11px; cursor: pointer; transition: .25s; }
.card:hover button, .card.hint button { transform: none; opacity: 1; }
.mask { position: absolute; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; animation: f .2s; }
.mask[hidden] { display: none; }
@keyframes f { from { opacity: 0; } }
.dlg { position: relative; display: flex; gap: 10px; width: 270px; padding: 12px; background: #fff; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,.2); animation: z .3s cubic-bezier(.2,.9,.3,1.2); }
@keyframes z { from { transform: scale(.85); opacity: 0; } }
.img { width: 110px; height: 120px; border-radius: 8px; background: radial-gradient(circle at 50% 40%, #fff 0 22%, transparent 23%), linear-gradient(135deg, #FFE7BA, #FA8C16); }
.info { display: grid; gap: 6px; align-content: start; font-size: 12px; }
.info b { font: 600 14px "Songti SC","Noto Serif SC",serif; }
.price { color: #FA8C16; font-weight: 700; }
.dots { display: flex; gap: 6px; } .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #E4E4E7; cursor: pointer; } .dots i.on { box-shadow: 0 0 0 2px #fff, 0 0 0 3px #FA8C16; }
.add { margin-top: 6px; border: 0; border-radius: 8px; padding: 7px; background: #FA8C16; color: #fff; font-size: 12px; cursor: pointer; }
.x { position: absolute; top: 4px; right: 6px; border: 0; background: none; font-size: 16px; color: #A1A1AA; cursor: pointer; }
</style>
<script>
const names = ["月白杯", "竹影盘", "江月壶", "青灯", "云纹碗", "石砚"], cards = document.querySelector(".cards"), mask = document.querySelector(".mask");
cards.innerHTML = names.map((n, i) => `<div class="card"><div class="ph" style="background:hsl(${30 + i * 40} 60% 88%)"></div><p>${n}</p><button>快速预览</button></div>`).join("");
let opener;
cards.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; opener = b; mask.querySelector("b").textContent = b.parentNode.querySelector("p").textContent; mask.hidden = false; mask.querySelector(".add").focus(); });
const close = () => { mask.hidden = true; opener?.focus({ preventScroll: true }); };
mask.addEventListener("click", e => { if (e.target === mask || e.target.closest(".x")) close(); const d = e.target.closest(".dots i"); if (d) { mask.querySelectorAll(".dots i").forEach(x => x.classList.toggle("on", x === d)); } });
document.addEventListener("keydown", e => e.key === "Escape" && close());
let t = 0; setInterval(() => { const c = cards.children[1]; t++ % 2 ? (c.classList.remove("hint"), mask.hidden = true) : (c.classList.add("hint"), setTimeout(() => { mask.hidden = false; }, 700)); }, 2600);
</script>
