<!--
{
  "en": "Login Page", "zh": "登录页",
  "lead": "一个完整的登录页用到好几个词：居中卡片、浮动标签输入框、显示密码按钮、主按钮加载态、第三方登录分隔线。输入后点登录看看整个流程。",
  "vague": ["登录页太简陋", "做个好看的登录框"],
  "terms": ["Centered Card 居中卡片", "Floating Label", "Loading Button", "Divider 分隔线"],
  "prompt": "做一个登录页：页面居中 360px 白色卡片，圆角 16px、Layered Elevation 阴影；顶部 Logo + 标题“欢迎回来”；邮箱和密码用 Floating Label 输入框，密码右侧有“显示”按钮；主按钮满宽品牌色 #FA8C16，点击后变 Loading Button 转圈 1 秒；下方“或”分隔线 + 两个第三方登录描边按钮；底部小字“还没有账号？注册”。"
}
-->
<form class="login" novalidate>
  <div class="head"><div class="logo">月</div><div><h1>欢迎回来</h1><p class="sub">登录江月，继续你的设计</p></div></div>
  <label class="f"><input type="email" placeholder=" " required><span>邮箱</span></label>
  <label class="f"><input type="password" placeholder=" " required><span>密码</span><button type="button" class="eye">显示</button></label>
  <button class="go">登录</button>
  <div class="or"><span>或</span></div>
  <div class="sso"><button type="button">微信</button><button type="button">GitHub</button></div>
  <p class="foot">还没有账号？<a href="#">注册</a></p>
</form>

<style>
.login { width: 300px; padding: 20px 22px 16px; background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07); display: grid; gap: 10px; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: #FA8C16; color: #fff; display: grid; place-items: center; font: 600 18px serif; }
.head { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
h1 { margin: 0; font-size: 19px; } .sub { margin: 2px 0 0; color: #71717A; font-size: 12px; }
.f { position: relative; display: block; }
.f input { width: 100%; box-sizing: border-box; height: 44px; padding: 15px 12px 3px; border: 1px solid #E4E4E7; border-radius: 10px; font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
.f input:focus { border-color: #FA8C16; box-shadow: 0 0 0 3px rgba(250,140,22,.15); }
.f span { position: absolute; left: 12px; top: 13px; color: #A1A1AA; font-size: 14px; pointer-events: none; transition: all .18s ease-out; }
.f input:focus + span, .f input:not(:placeholder-shown) + span { top: 5px; font-size: 11px; color: #FA8C16; }
.eye { position: absolute; right: 8px; top: 8px; border: 0; background: none; color: #71717A; font-size: 12px; cursor: pointer; padding: 6px; }
.go { height: 40px; border: 0; border-radius: 10px; background: #FA8C16; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: filter .2s, transform .1s; }
.go:hover { filter: brightness(1.06); } .go:active { transform: scale(.98); }
.go.busy { color: transparent; position: relative; }
.go.busy::after { content: ""; position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.go.done { background: #22C55E; }
.or { display: flex; align-items: center; gap: 10px; color: #A1A1AA; font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: #E4E4E7; }
.sso { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sso button { height: 34px; border: 1px solid #E4E4E7; background: #fff; border-radius: 10px; font-size: 13px; cursor: pointer; }
.sso button:hover { background: #FAFAFA; }
.foot { margin: 0; text-align: center; font-size: 12px; color: #71717A; } .foot a { color: #FA8C16; text-decoration: none; }
</style>
<script>
const form = document.querySelector(".login"), go = document.querySelector(".go"), pw = form.querySelector("[type=password]");
document.querySelector(".eye").addEventListener("click", (e) => { const show = pw.type === "password"; pw.type = show ? "text" : "password"; e.target.textContent = show ? "隐藏" : "显示"; });
form.addEventListener("submit", (e) => {
  e.preventDefault(); if (go.classList.contains("busy")) return;
  go.classList.add("busy");
  setTimeout(() => { go.classList.replace("busy", "done"); go.textContent = "✓ 登录成功"; }, 1000);
  setTimeout(() => { go.classList.remove("done"); go.textContent = "登录"; }, 2600);
});
</script>
