{
  "en": "Bulk Action Bar", "zh": "批量操作栏",
  "lead": "在列表里勾选了几项之后，底部浮起一条操作栏：“已选 3 项”加上删除、移动、导出等按钮。没选的时候它不出现，不占地方。",
  "vague": ["多选之后怎么操作", "批量删除放哪"],
  "terms": ["Bulk Actions", "Contextual Action Bar", "Selection Mode 多选模式"],
  "prompt": "文件列表支持多选，勾选任意一项后从底部滑出 Bulk Action Bar（深色 #18181B 胶囊、居中悬浮距底 16px、200ms 上滑）：左侧“已选 N 项”和“全选”，右侧移动 / 导出 / 删除（红）图标按钮，最右 × 取消选择；N 变化时数字有轻微弹跳；取消全部勾选后栏收起。"
}
-->
<div class="box">
  <ul class="files"></ul>
  <div class="bar"><span><b class="n">0</b> 项已选</span><button class="all">全选</button><i></i><button>移动</button><button>导出</button><button class="del">删除</button><button class="x" aria-label="取消选择">×</button></div>
</div>

<style>
.box { position: relative; width: 340px; height: 240px; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; overflow: hidden; }
.files { margin: 0; padding: 6px; list-style: none; }
.files li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.files li:hover { background: #FAFAFA; } .files li.on { background: #FFF4E6; }
.files input { accent-color: #FA8C16; margin: 0; } .files small { margin-left: auto; color: #A1A1AA; font-size: 11px; }
.bar { position: absolute; left: 50%; bottom: 12px; display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; border-radius: 999px; background: #18181B; color: #fff; font-size: 12px; white-space: nowrap;
  transform: translate(-50%, 70px); transition: transform .2s cubic-bezier(.34, 1.3, .64, 1); }
.box.sel .bar { transform: translate(-50%, 0); }
.bar .n { display: inline-block; } .bar .n.bump { animation: bump .2s; } @keyframes bump { 50% { transform: scale(1.3); } }
.bar i { width: 1px; height: 16px; background: #3F3F46; margin: 0 4px; }
.bar button { border: 0; background: none; color: #E4E4E7; font-size: 12px; padding: 5px 8px; border-radius: 999px; cursor: pointer; } .bar button:hover { background: #27272A; }
.bar .del { color: #F87171; } .bar .all { color: #FDBA74; } .bar .x { font-size: 15px; }
</style>

<script>
const F = [["首页设计稿.fig", "2.4 MB"], ["配色规范.pdf", "860 KB"], ["动效演示.mp4", "18 MB"], ["图标合集.zip", "5.1 MB"], ["文案.docx", "64 KB"]];
const ul = document.querySelector(".files"), box = document.querySelector(".box"), n = document.querySelector(".n");
ul.innerHTML = F.map(([f, s]) => `<li><input type="checkbox" aria-label="选择 ${f}">${f}<small>${s}</small></li>`).join("");
const boxes = [...ul.querySelectorAll("input")];
function sync() {
  const k = boxes.filter((b) => b.checked).length; boxes.forEach((b) => b.closest("li").classList.toggle("on", b.checked));
  box.classList.toggle("sel", k > 0); if (+n.textContent !== k) { n.textContent = k; n.classList.remove("bump"); n.offsetWidth; n.classList.add("bump"); }
}
ul.addEventListener("click", (e) => { const li = e.target.closest("li"); if (li && e.target.tagName !== "INPUT") li.querySelector("input").checked ^= 1; sync(); });
document.querySelector(".all").onclick = () => { boxes.forEach((b) => (b.checked = true)); sync(); };
document.querySelector(".x").onclick = () => { boxes.forEach((b) => (b.checked = false)); sync(); };
boxes[0].checked = boxes[2].checked = true; sync();
</script>
