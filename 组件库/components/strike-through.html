<!--
{
  "en": "Animated Strikethrough", "zh": "划掉改写",
  "lead": "一根线从左到右把旧词划掉，然后新词出现在旁边。用来表达“不是 A，而是 B”的观点，或者价格打折，比直接写结论更有戏剧感。",
  "vague": ["想表达不是这个而是那个", "原价划掉"],
  "terms": ["Strikethrough", "Text Replace 文字替换", "Line Draw 画线"],
  "prompt": "标题做 Animated Strikethrough：旧词上方一根 3px 江月橘横线从左到右画过（伪元素 scaleX 0→1，400ms ease-out），旧词同时变灰 #A1A1AA；随后新词从下方 8px 淡入（300ms），旧词保留 <s> 语义；价格场景同理：原价划掉、现价放大变红。"
}
-->
<div class="wrap">
  <h2>别再说<s class="old">高级感</s><b class="new">留白与层次</b></h2>
  <p class="price"><s class="old">¥ 199</s><b class="new">¥ 99</b></p>
</div>

<style>
.wrap { display: grid; gap: 18px; }
h2 { margin: 0; font: 700 28px "Songti SC", "Noto Serif SC", serif; color: #18181B; display: flex; gap: 10px; align-items: baseline; }
.old { position: relative; text-decoration: none; animation: grey .4s .6s forwards; }
.old::after { content: ""; position: absolute; left: -2px; right: -2px; top: 52%; height: 3px; border-radius: 2px; background: #FA8C16; transform: scaleX(0); transform-origin: left; animation: line .4s .6s ease-out forwards; }
.new { opacity: 0; transform: translateY(8px); animation: in .3s 1.1s ease-out forwards; color: #FA8C16; }
@keyframes line { to { transform: scaleX(1); } } @keyframes grey { to { color: #A1A1AA; } } @keyframes in { to { opacity: 1; transform: none; } }
.price { margin: 0; display: flex; gap: 10px; align-items: baseline; font-size: 18px; color: #52525B; }
.price .new { font-size: 30px; font-weight: 800; color: #EF4444; }
</style>
