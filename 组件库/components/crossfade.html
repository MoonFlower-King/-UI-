<!--
{
  "en": "Crossfade", "zh": "交叉淡化",
  "lead": "旧内容淡出的同时新内容淡入，两者有一小段重叠，画面不会出现“先空一下”的闪白。切换图片、标签内容、状态文字时最稳妥的过渡。",
  "vague": ["切换内容时会闪一下", "换图太突兀"],
  "terms": ["Crossfade", "Dissolve 溶解转场", "Fade Through 淡入穿透"],
  "prompt": "图片轮播用交叉淡化：所有图片叠放在同一位置（grid 同一格），当前图透明度 1、其他为 0，切换时旧图淡出、新图淡入同时进行，时长 500ms ease-in-out，期间不出现空白；标题文字同样交叉淡化；下方圆点指示当前第几张，每 2.5 秒自动切换。"
}
-->
<div class="cf">
  <div class="imgs"><i class="on" style="--g:linear-gradient(160deg,#FDBA74,#F97316)"></i><i style="--g:linear-gradient(160deg,#1E3A5F,#0F1726)"></i><i style="--g:linear-gradient(160deg,#86EFAC,#0F766E)"></i></div>
  <div class="caps"><b class="on">日落 · 江边</b><b>夜色 · 江心</b><b>清晨 · 竹林</b></div>
  <nav><button class="on"></button><button></button><button></button></nav>
</div>
<style>
.cf { width: 260px; padding: 12px; background: #fff; border: 1px solid #E4E4E7; border-radius: 16px; }
.imgs, .caps { display: grid; } .imgs > *, .caps > * { grid-area: 1 / 1; opacity: 0; transition: opacity .5s ease-in-out; } .imgs .on, .caps .on { opacity: 1; }
.imgs i { height: 140px; border-radius: 12px; background: var(--g); }
.caps { margin: 10px 2px 8px; } .caps b { font: 600 14px "Songti SC", serif; color: #18181B; }
nav { display: flex; gap: 6px; } nav button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 99px; background: #E4E4E7; cursor: pointer; transition: width .3s, background .3s; } nav button.on { width: 20px; background: #FA8C16; }
</style>
<script>
const groups = [".imgs > i", ".caps > b", "nav button"].map((s) => [...document.querySelectorAll(s)]);
let k = 0, t;
const go = (n) => { k = n; groups.forEach((g) => g.forEach((el, i) => el.classList.toggle("on", i === k))); clearInterval(t); t = setInterval(() => go((k + 1) % 3), 2500); };
groups[2].forEach((b, i) => b.addEventListener("click", () => go(i)));
go(0);
</script>
