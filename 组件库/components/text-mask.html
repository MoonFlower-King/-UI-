<h1 class="mask">江月</h1>
<p class="cap">字是窗，后面是流动的江面</p>

<style>
.mask { margin: 0; font: 900 120px/1 "Songti SC", "Noto Serif SC", serif; letter-spacing: .04em; color: #FA8C16; }
@supports (-webkit-background-clip: text) or (background-clip: text) {
  .mask { color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 300% 100%;
    background-image: radial-gradient(circle at 30% 30%, #FFE7B0 0 6%, transparent 14%), linear-gradient(100deg, #0F1A33 0%, #1E3A5F 25%, #FA8C16 45%, #FFD58A 55%, #1E3A5F 75%, #0F1A33 100%);
    animation: flow 12s linear infinite; }
}
@keyframes flow { to { background-position: 300% 0, 300% 0; } }
.cap { position: absolute; bottom: 40px; left: 0; right: 0; margin: 0; text-align: center; font-size: 12px; color: #A1A1AA; }
@media (prefers-reduced-motion: reduce) { .mask { animation: none; } }
</style>
