<div class="iv">
  <input type="password" placeholder="设置密码">
  <ul><li data-r="len">至少 8 位</li><li data-r="num">包含数字</li><li data-r="up">包含大写字母</li></ul>
</div>

<style>
.iv { display: grid; gap: 10px; width: min(240px, 88vw); }
.iv input { border: 1px solid #E4E4E7; border-radius: 10px; padding: 11px; font-size: 14px; }
.iv ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12px; color: #A1A1AA; }
.iv li::before { content: "○ "; } .iv li.ok { color: #248A3D; } .iv li.ok::before { content: "✓ "; }
</style>
<script>
const inp = document.querySelector(".iv input");
const rules = { len: v => v.length >= 8, num: v => /\d/.test(v), up: v => /[A-Z]/.test(v) };
inp.oninput = () => document.querySelectorAll(".iv li").forEach(li => li.classList.toggle("ok", rules[li.dataset.r](inp.value)));
// 预览时自动输入一遍
const demo = "Moon2026x"; let k = 0; const t = setInterval(() => { inp.value = demo.slice(0, ++k); inp.oninput(); if (k >= demo.length) clearInterval(t); }, 250);
</script>
