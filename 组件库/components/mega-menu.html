<div class="nav">
  <span class="logo">江月</span>
  <div class="item open"><button>产品 <svg viewBox="0 0 12 12"><path d="M3 4.5 6 7.5 9 4.5"/></svg></button>
    <div class="panel">
      <a href="#"><i>◐</i><b>组件库</b><small>两百多个能直接用的组件</small></a>
      <a href="#"><i>✦</i><b>调配台</b><small>拼出一整段提示词</small></a>
      <a href="#"><i>◎</i><b>感觉翻译</b><small>把“不高级”翻成专业词</small></a>
      <a href="#"><i>▤</i><b>图鉴</b><small>跟着视频认识术语</small></a>
      <div class="promo"><b>新手入门</b><small>三分钟学会给 AI 描述界面</small><span>开始 →</span></div>
    </div>
  </div>
  <span>文档</span><span>价格</span>
</div>

<style>
.nav { position: relative; display: flex; align-items: center; gap: 18px; width: 500px; padding: 10px 16px; box-sizing: border-box; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; font-size: 13px; color: #52525B; align-self: start; margin-top: 30px; }
.logo { font-weight: 700; color: #18181B; margin-right: 8px; }
.item button { border: 0; background: none; font: inherit; color: #18181B; cursor: pointer; display: flex; gap: 4px; align-items: center; padding: 4px 0; }
.item svg { width: 11px; fill: none; stroke: currentColor; stroke-width: 1.6; transition: transform .2s; }
.item.open svg { transform: rotate(180deg); }
.panel { position: absolute; top: calc(100% + 8px); left: 0; right: 0; display: grid; grid-template-columns: 1fr 1fr 150px; grid-template-rows: auto auto; gap: 4px; padding: 10px; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,.1);
  opacity: 0; visibility: hidden; transform: translateY(-6px); transition: .18s ease-out; }
.item.open .panel { opacity: 1; visibility: visible; transform: none; }
.panel a { display: grid; grid-template-columns: 32px 1fr; column-gap: 10px; padding: 8px; border-radius: 9px; text-decoration: none; }
.panel a:hover { background: #FAFAFA; }
.panel i { grid-row: span 2; width: 32px; height: 32px; border-radius: 8px; background: #FFF4E6; color: #FA8C16; display: grid; place-items: center; font-style: normal; }
.panel b { color: #18181B; font-size: 13px; } .panel small { color: #A1A1AA; font-size: 11px; }
.promo { grid-column: 3; grid-row: 1 / 3; display: grid; align-content: end; gap: 4px; padding: 12px; border-radius: 10px; background: linear-gradient(160deg, #1E2A44, #121722); color: #fff; }
.promo small { color: #A1A1AA; font-size: 11px; } .promo span { color: #FFD58A; font-size: 12px; margin-top: 6px; }
</style>

<script>
const item = document.querySelector(".item");
let t;
item.addEventListener("mouseenter", () => { clearTimeout(t); t = setTimeout(() => item.classList.add("open"), 150); });
item.addEventListener("mouseleave", () => { clearTimeout(t); t = setTimeout(() => item.classList.remove("open"), 200); });
item.querySelector("button").addEventListener("click", () => item.classList.toggle("open"));
</script>
