<div class="scale"></div>
<p class="info">点一格复制色值</p>

<style>
.scale { display: grid; grid-template-columns: repeat(10, 34px); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.scale button { height: 110px; border: 0; padding: 0 0 8px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; font: 600 10px ui-monospace, Menlo, monospace; cursor: pointer; transition: transform .15s; }
.scale button:hover { transform: scaleY(1.06); }
.scale button.base { outline: 2px solid #18181B; outline-offset: -2px; }
.info { position: absolute; bottom: 40px; left: 0; right: 0; margin: 0; text-align: center; font-size: 12px; color: #71717A; font-family: ui-monospace, Menlo, monospace; }
</style>

<script>
// 和白色 / 黑色按比例混合；深色一侧混一点棕色，避免发灰
const base = [250, 140, 22], mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const steps = [[50, .92], [100, .82], [200, .64], [300, .44], [400, .22], [500, 0], [600, -.14], [700, -.3], [800, -.48], [900, -.64]];
const hex = (c) => "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("").toUpperCase();
const box = document.querySelector(".scale"), info = document.querySelector(".info");
box.innerHTML = steps.map(([n, t]) => {
  const c = t >= 0 ? mix(base, [255, 250, 243], t) : mix(base, [60, 22, 4], -t);
  return `<button style="background:${hex(c)};color:${n >= 500 ? "#fff" : "#7C2D12"}" data-hex="${hex(c)}" class="${n === 500 ? "base" : ""}" title="${n} ${hex(c)}">${n}</button>`;
}).join("");
box.addEventListener("click", (e) => { const h = e.target.dataset.hex; if (!h) return; navigator.clipboard?.writeText(h).catch(() => {}); info.textContent = `已复制 ${h}`; });
</script>
