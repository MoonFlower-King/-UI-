<div class="hero">
  <span class="blob"></span>
  <span class="av">月</span>
</div>

<style>
.hero { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
.blob { position: absolute; width: 200px; height: 200px; background: linear-gradient(135deg, #FA8C16, #F472B6); filter: drop-shadow(0 10px 30px rgba(244,114,182,.4)); animation: morph 8s ease-in-out infinite; }
@keyframes morph {
  0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(0); }
  25% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
  50% { border-radius: 50% 60% 30% 60% / 30% 40% 70% 60%; transform: rotate(20deg); }
  75% { border-radius: 40% 60% 60% 40% / 70% 30% 50% 40%; }
}
.av { position: relative; width: 110px; height: 110px; border-radius: 50%; background: #121722; color: #FFD58A; display: grid; place-items: center; font: 700 44px "Songti SC", serif; border: 4px solid #fff; }
@media (prefers-reduced-motion: reduce) { .blob { animation: none; border-radius: 50%; } }
</style>
