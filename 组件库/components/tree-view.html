<style>
.tree { width: min(240px, 80vw); padding: 10px; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); font-size: 13px; color: #3F3F46; }
.tree details details, .tree details > a { margin-left: 14px; padding-left: 8px; border-left: 1px solid #E4E4E7; }
.tree summary { list-style: none; display: flex; align-items: center; gap: 4px; padding: 5px 6px; border-radius: 6px; cursor: pointer; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before { content: "▸"; display: inline-block; width: 12px; color: #A1A1AA; transition: transform .2s; }
.tree details[open] > summary::before { transform: rotate(90deg); }
.tree a { display: block; padding: 5px 6px 5px 22px; border-radius: 6px; cursor: pointer; }
.tree summary:hover, .tree a:hover { background: #F4F4F5; }
.tree a.sel { background: #FFF4E6; color: #C2410C; }
</style>
<script>
document.querySelectorAll(".tree a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll(".tree a").forEach(x => x.classList.remove("sel")); a.classList.add("sel");
}));
setTimeout(() => document.querySelectorAll(".tree details")[2].open = true, 800);
</script>
