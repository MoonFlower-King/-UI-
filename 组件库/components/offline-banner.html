<div class="app">
  <div class="ob"><span class="ic">⌁</span><span class="msg"></span></div>
  <header>江月笔记</header>
  <div class="body"><i></i><i></i><i class="s"></i></div>
  <button class="sim">模拟断网</button>
</div>

<style>
.app { position: relative; width: 320px; height: 230px; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid #E4E4E7; display: flex; flex-direction: column; }
.ob { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; background: #3F3F46; color: #fff; font-size: 12px; transition: height .25s ease, background .3s; flex: none; }
.app.off .ob, .app.back .ob { height: 36px; } .app.back .ob { background: #16A34A; }
.ic { font-size: 14px; }
header { padding: 12px 16px; font-weight: 700; font-size: 14px; border-bottom: 1px solid #F4F4F5; }
.body { padding: 16px; display: grid; gap: 8px; } .body i { height: 10px; border-radius: 4px; background: #F4F4F5; } .body .s { width: 50%; }
.sim { position: absolute; right: 12px; bottom: 12px; border: 1px solid #E4E4E7; background: #fff; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
</style>

<script>
const app = document.querySelector(".app"), msg = document.querySelector(".msg"), sim = document.querySelector(".sim");
let off = false, t;
function set(isOff) {
  off = isOff; clearTimeout(t); sim.textContent = off ? "模拟恢复网络" : "模拟断网";
  if (off) { app.className = "app off"; msg.textContent = "你已离线，修改会在联网后自动同步"; }
  else { app.className = "app back"; msg.textContent = "已重新连接"; t = setTimeout(() => (app.className = "app"), 2000); }
}
addEventListener("offline", () => set(true)); addEventListener("online", () => set(false));
sim.addEventListener("click", () => set(!off));
</script>
