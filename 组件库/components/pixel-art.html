<div class="px">
  <header><span>LV.12 江月</span><span class="hp"><i></i><i></i><i></i><i class="off"></i></span></header>
  <div class="scr"><i class="moon"></i></div>
  <p>SCORE <b>00420</b></p>
  <button>▶ START</button>
</div>

<style>
.px { width: 230px; padding: 14px; background: #FFF4D6; border: 4px solid #000; box-shadow: 6px 6px 0 #000; font: 700 12px/1.2 ui-monospace, "Courier New", monospace; color: #000; display: grid; gap: 10px; image-rendering: pixelated; }
header { display: flex; justify-content: space-between; align-items: center; }
.hp { display: flex; gap: 3px; } .hp i { width: 12px; height: 11px; background: #FA8C16; clip-path: polygon(0 20%, 20% 20%, 20% 0, 40% 0, 40% 20%, 60% 20%, 60% 0, 80% 0, 80% 20%, 100% 20%, 100% 60%, 80% 60%, 80% 80%, 60% 80%, 60% 100%, 40% 100%, 40% 80%, 20% 80%, 20% 60%, 0 60%); } .hp .off { background: #1E3A5F; opacity: .3; }
.scr { position: relative; height: 90px; background: #1E3A5F; border: 4px solid #000; background-image: linear-gradient(#000 0 0), linear-gradient(#000 0 0); background-size: 100% 4px; background-repeat: no-repeat; background-position: 0 64px; }
.moon { position: absolute; left: 140px; top: 14px; width: 24px; height: 24px; background: #FFF4D6; box-shadow: 4px 0 0 #FFF4D6, -4px 0 0 #FFF4D6, 0 4px 0 #FFF4D6, 0 -4px 0 #FFF4D6; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { background: #FA8C16; } }
p { margin: 0; letter-spacing: .1em; } b { color: #FA8C16; }
button { border: 4px solid #000; background: #FA8C16; color: #000; font: inherit; padding: 8px 0; box-shadow: 4px 4px 0 #000; cursor: pointer; letter-spacing: .1em; }
button:active { transform: translate(4px, 4px); box-shadow: none; }
</style>
<script>
const score = document.querySelector("b"); let s = 420;
document.querySelector("button").addEventListener("click", () => { const to = s + 100; const t = setInterval(() => { s += 10; score.textContent = String(s).padStart(5, "0"); if (s >= to) clearInterval(t); }, 60); });
</script>
