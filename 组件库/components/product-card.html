<!--
{
  "en": "Product Card", "zh": "商品卡片",
  "lead": "电商最常见的单元：上图下文，左上角折扣标签，右上角收藏心形，价格把现价放大、原价划掉，底部加购按钮。悬停时图片轻微放大、卡片抬起。",
  "vague": ["商品列表不好看", "想让人更想买"],
  "terms": ["Product Card", "Badge 折扣标签", "Strikethrough Price 划线价", "Add to Cart 加购"],
  "prompt": "做 Product Card：宽 220px 白卡圆角 16px；上方 1:1 商品图区，悬停时图片 scale(1.05)、卡片上浮 4px 并加深阴影（300ms）；图左上角红色“-30%”标签，右上角圆形收藏按钮，点击心形变红并弹跳；下方商品名两行截断、4.8 ★ 评分；现价 20px 粗体品牌色，原价灰色划线；右下角圆形 + 号加购按钮，点击后变成 ✓。"
}
-->
<div class="prod">
  <div class="img"><div class="art"></div><span class="off">-30%</span><button class="fav" aria-label="收藏">♡</button></div>
  <div class="info">
    <h4>月光陶瓷马克杯 · 手工釉色 350ml</h4>
    <p class="rate">★ 4.8 <span>· 已售 2.3k</span></p>
    <div class="buy"><p><b>¥69</b><s>¥99</s></p><button class="add" aria-label="加入购物车">+</button></div>
  </div>
</div>

<style>
.prod { width: 210px; background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #F0F0F2; transition: transform .3s, box-shadow .3s; }
.prod:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.1); }
.img { position: relative; aspect-ratio: 1; overflow: hidden; background: #F5EFE6; }
.art { position: absolute; inset: 0; background: radial-gradient(circle at 50% 58%, #FFF 0 26%, transparent 27%), radial-gradient(circle at 74% 56%, transparent 0 9%, #FFF 9.5% 13%, transparent 13.5%), radial-gradient(circle at 50% 36%, #FDE68A 0 7%, transparent 7.5%); transition: transform .4s; }
.prod:hover .art { transform: scale(1.05); }
.off { position: absolute; top: 10px; left: 10px; background: #EF4444; color: #fff; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
.fav { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); font-size: 16px; color: #71717A; cursor: pointer; }
.fav.on { color: #EF4444; animation: pop .35s cubic-bezier(.34,1.6,.64,1); }
@keyframes pop { 50% { transform: scale(1.3); } }
.info { padding: 10px 12px 12px; }
h4 { margin: 0; font-size: 13px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rate { margin: 4px 0 6px; font-size: 11px; color: #F59E0B; } .rate span { color: #A1A1AA; }
.buy { display: flex; align-items: center; justify-content: space-between; } .buy p { margin: 0; }
.buy b { font-size: 19px; color: #FA8C16; } .buy s { margin-left: 4px; font-size: 12px; color: #A1A1AA; }
.add { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #18181B; color: #fff; font-size: 17px; cursor: pointer; transition: background .2s, transform .1s; }
.add:active { transform: scale(.9); } .add.ok { background: #22C55E; }
</style>
<script>
const fav = document.querySelector(".fav"), add = document.querySelector(".add");
fav.addEventListener("click", () => { const on = fav.classList.toggle("on"); fav.textContent = on ? "♥" : "♡"; });
add.addEventListener("click", () => { add.classList.add("ok"); add.textContent = "✓"; setTimeout(() => { add.classList.remove("ok"); add.textContent = "+"; }, 1500); });
</script>
