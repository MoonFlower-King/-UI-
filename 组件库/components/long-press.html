<!--
{
  "en": "Long Press", "zh": "长按",
  "lead": "手机上按住一个东西不放（约半秒），弹出更多操作或进入编辑模式。按住期间要有反馈：元素轻轻缩小、一圈进度在走，到时间时手机轻震一下，菜单弹出。",
  "vague": ["按住弹出菜单", "手机长按"],
  "terms": ["Long Press", "Press and Hold", "Haptic Feedback 触感反馈", "Context Menu"],
  "prompt": "消息气泡支持 Long Press：按下后气泡 300ms 内缩小到 0.96，按住 500ms 触发（调用 navigator.vibrate(10)），气泡回弹放大到 1.02 并在上方弹出横向快捷表情条（6 个表情，依次弹出间隔 30ms）和下方操作菜单（回复/复制/删除）；松手过早则取消；背景其余内容模糊变暗。"
}
-->
<div class="lp">
  <p class="other">今晚的江面好亮</p>
  <p class="bub">我刚拍了月亮，发你看 🌕</p>
  <div class="emo"><i>❤️</i><i>😂</i><i>😮</i><i>👍</i><i>🔥</i><i>🌙</i></div>
  <ul class="ops"><li>回复</li><li>复制</li><li class="del">删除</li></ul>
  <small>按住气泡</small>
</div>

<style>
.lp { position: relative; width: 280px; height: 260px; background: #F4F4F5; border-radius: 18px; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
.lp p { margin: 6px 0; padding: 9px 13px; border-radius: 16px; font-size: 13px; max-width: 75%; transition: transform .3s, filter .3s, opacity .3s; }
.other { background: #fff; align-self: flex-start; }
.bub { position: relative; z-index: 2; background: #FA8C16; color: #fff; align-self: flex-end; cursor: pointer; touch-action: none; }
.lp.press .bub { transform: scale(.96); } .lp.open .bub { transform: scale(1.02); box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.lp.open .other { filter: blur(3px); opacity: .5; }
.emo { position: absolute; right: 16px; top: 64px; display: flex; gap: 2px; padding: 4px 6px; background: #fff; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,.12); z-index: 3; }
.emo i { font-style: normal; font-size: 18px; padding: 2px; transform: scale(0); transition: transform .25s cubic-bezier(.34,1.6,.64,1); cursor: pointer; }
.lp.open .emo i { transform: scale(1); } .emo i:hover { transform: scale(1.3) !important; }
.ops { position: absolute; right: 16px; top: 160px; margin: 0; padding: 4px; list-style: none; background: #fff; border-radius: 12px; width: 120px; box-shadow: 0 8px 20px rgba(0,0,0,.12); z-index: 3; opacity: 0; transform: scale(.9); transform-origin: top right; transition: all .2s; pointer-events: none; }
.lp.open .ops { opacity: 1; transform: none; pointer-events: auto; }
.ops li { padding: 7px 10px; font-size: 13px; border-radius: 8px; cursor: pointer; } .ops li:hover { background: #F4F4F5; } .del { color: #DC2626; }
small { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 11px; color: #A1A1AA; }
</style>
<script>
const lp = document.querySelector(".lp"), bub = document.querySelector(".bub"); let t;
document.querySelectorAll(".emo i").forEach((e, i) => e.style.transitionDelay = i * 30 + "ms");
bub.addEventListener("pointerdown", () => { lp.classList.remove("open"); lp.classList.add("press"); t = setTimeout(() => { lp.classList.replace("press", "open"); navigator.vibrate?.(10); }, 500); });
["pointerup", "pointerleave"].forEach((ev) => bub.addEventListener(ev, () => { clearTimeout(t); lp.classList.remove("press"); }));
document.querySelectorAll(".ops li, .emo i").forEach((x) => x.addEventListener("click", () => lp.classList.remove("open")));
</script>
