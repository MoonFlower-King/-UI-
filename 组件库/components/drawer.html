<button class="open-drawer">打开购物车</button>

<div class="drawer-layer">
  <div class="drawer-mask"></div>
  <aside class="drawer" aria-label="购物车">
    <header><h3>购物车 · 2 件</h3><button class="close" aria-label="关闭">✕</button></header>
    <ul>
      <li><span class="thumb"></span><div><b>无线降噪耳机</b><small>¥899</small></div></li>
      <li><span class="thumb"></span><div><b>磁吸充电座</b><small>¥129</small></div></li>
    </ul>
    <footer><button class="checkout">去结算 ¥1028</button></footer>
  </aside>
</div>

<style>
.open-drawer { border: 0; background: #18181B; color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
.drawer-layer { position: fixed; inset: 0; pointer-events: none; }
.drawer-mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .3); opacity: 0; transition: opacity .3s; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(360px, 85%); background: #fff; display: flex; flex-direction: column;
  box-shadow: -12px 0 40px rgba(0, 0, 0, .12); transform: translateX(100%); transition: transform .3s cubic-bezier(.32, .72, 0, 1); }
.drawer-layer.open { pointer-events: auto; }
.drawer-layer.open .drawer-mask { opacity: 1; }
.drawer-layer.open .drawer { transform: none; }
.drawer header { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid #F4F4F5; }
.drawer h3 { margin: 0; font-size: 17px; }
.drawer .close { border: 0; background: #F4F4F5; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
.drawer ul { flex: 1; overflow-y: auto; margin: 0; padding: 12px 20px; list-style: none; display: grid; gap: 12px; align-content: start; }
.drawer li { display: flex; gap: 12px; align-items: center; }
.drawer .thumb { width: 52px; height: 52px; border-radius: 10px; background: #F4F4F5; flex-shrink: 0; }
.drawer li b { display: block; font-size: 14px; } .drawer li small { color: #71717A; }
.drawer footer { padding: 16px 20px; border-top: 1px solid #F4F4F5; }
.checkout { width: 100%; height: 46px; border: 0; border-radius: 12px; background: #FA8C16; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>

<script>
const layer = document.querySelector(".drawer-layer");
document.querySelector(".open-drawer").addEventListener("click", () => layer.classList.add("open"));
layer.querySelector(".drawer-mask").addEventListener("click", () => layer.classList.remove("open"));
layer.querySelector(".close").addEventListener("click", () => layer.classList.remove("open"));
</script>
