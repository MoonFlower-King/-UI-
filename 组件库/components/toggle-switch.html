<label class="switch"><input type="checkbox" checked><span></span></label>

<style>
.switch { position: relative; display: inline-block; width: 52px; height: 32px; }
.switch input { position: absolute; opacity: 0; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: #E4E4E7; cursor: pointer; transition: background .25s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), width .15s; }
.switch input:checked + span { background: #34C759; }
.switch input:checked + span::after { transform: translateX(20px); }
.switch span:active::after { width: 30px; }
.switch input:checked + span:active::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid #007AFF; outline-offset: 2px; }
</style>
