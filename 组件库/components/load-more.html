<!--
{
  "en": "Load More Button", "zh": "加载更多",
  "lead": "列表底部一个“加载更多”按钮，点一下再追加一批内容，并显示“已显示 12 / 48”。比无限滚动更可控（用户能到达页脚），又比翻页更流畅。",
  "vague": ["分页太麻烦", "无限滚动找不到页脚"],
  "terms": ["Load More", "Pagination 分页", "Progressive Loading"],
  "prompt": "作品列表底部用 Load More：按钮全宽、浅灰描边，下方小字“已显示 12 / 48”；点击后按钮内显示转圈并禁用，新内容以错峰淡入（每项延迟 40ms）追加到列表，同时把焦点移到第一条新内容；全部加载完后按钮换成“已经到底了”文字。"
}
-->
<div class="lm">
  <div class="grid"></div>
  <button class="more">加载更多</button>
  <p class="meta"></p>
</div>

<style>
.lm { width: 300px; height: 300px; overflow-y: auto; padding: 12px; box-sizing: border-box; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; scrollbar-width: thin; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid i { aspect-ratio: 1; border-radius: 10px; animation: in .3s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
.more { width: 100%; height: 36px; margin-top: 12px; border: 1px solid #E4E4E7; border-radius: 10px; background: #fff; font-size: 13px; color: #18181B; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.more:hover { background: #FAFAFA; } .more:disabled { color: #A1A1AA; cursor: default; }
.spin { width: 12px; height: 12px; border: 2px solid #E4E4E7; border-top-color: #FA8C16; border-radius: 50%; animation: sp .7s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
.meta { margin: 6px 0 0; text-align: center; font-size: 11px; color: #A1A1AA; }
.end { border: 0; background: none; }
</style>

<script>
const TOTAL = 24, STEP = 9, grid = document.querySelector(".grid"), btn = document.querySelector(".more"), meta = document.querySelector(".meta");
let shown = 0;
function add() {
  const n = Math.min(STEP, TOTAL - shown);
  grid.insertAdjacentHTML("beforeend", Array.from({ length: n }, (_, i) => `<i tabindex="-1" style="background:hsl(${(shown + i) * 23} 70% 82%);animation-delay:${i * 40}ms"></i>`).join(""));
  const first = grid.children[shown]; shown += n; meta.textContent = `已显示 ${shown} / ${TOTAL}`;
  if (shown >= TOTAL) { btn.disabled = true; btn.className = "more end"; btn.textContent = "已经到底了"; }
  return first;
}
btn.addEventListener("click", () => {
  btn.disabled = true; btn.innerHTML = '<i class="spin"></i>加载中…';
  setTimeout(() => { btn.disabled = false; btn.textContent = "加载更多"; add()?.focus({ preventScroll: true }); }, 700);
});
add();
</script>
