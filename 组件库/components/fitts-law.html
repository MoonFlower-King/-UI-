<!--
{
  "en": "Fitts's Law", "zh": "费茨定律",
  "lead": "按钮越大、离手指（鼠标）越近，就越容易点中、点得越快。所以重要按钮要做大、放在拇指够得到的地方；危险按钮反而要小一点、离远一点。下面两个目标，点点看哪个更容易。",
  "vague": ["按钮太难点", "手机上老是点错"],
  "terms": ["Fitts's Law", "Target Size 目标尺寸", "Thumb Zone 拇指热区", "Touch Target"],
  "prompt": "按 Fitts's Law 调整操作区：主操作按钮满宽、高 48px，放在手机屏幕下方拇指热区；次要操作缩小为文字按钮；危险操作（删除）远离主按钮至少 24px 并且需要二次确认；所有可点区域不小于 44×44px，图标按钮用透明内边距扩大点击范围。"
}
-->
<div class="fl">
  <div class="arena"><button class="t big">大目标</button><button class="t small">小</button></div>
  <p>点中 · 大 <b class="nb">0</b> 次　小 <b class="ns">0</b> 次</p>
  <small>目标越大、越近，越好点</small>
</div>

<style>
.fl { display: grid; gap: 8px; justify-items: center; }
.arena { position: relative; width: 300px; height: 170px; background: #fff; border: 1px solid #F0F0F2; border-radius: 16px; background-image: radial-gradient(circle at 20% 80%, rgba(250,140,22,.08) 0 30%, transparent 31%); }
.t { position: absolute; border: 0; border-radius: 12px; cursor: pointer; transition: transform .1s, left .3s, top .3s; }
.t:active { transform: scale(.94); }
.big { left: 24px; top: 92px; width: 120px; height: 56px; background: #FA8C16; color: #fff; font-weight: 600; }
.small { left: 250px; top: 18px; width: 26px; height: 22px; background: #E4E4E7; font-size: 10px; color: #71717A; border-radius: 6px; }
p { margin: 0; font-size: 12px; color: #52525B; } b { color: #FA8C16; font-variant-numeric: tabular-nums; } small { font-size: 11px; color: #A1A1AA; }
.hit { animation: hit .3s; } @keyframes hit { 50% { box-shadow: 0 0 0 8px rgba(250,140,22,.25); } }
</style>
<script>
const nb = document.querySelector(".nb"), ns = document.querySelector(".ns"); let a = 0, c = 0;
const flash = (el) => { el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); };
document.querySelector(".big").addEventListener("click", (e) => { nb.textContent = ++a; flash(e.currentTarget); });
document.querySelector(".small").addEventListener("click", (e) => { ns.textContent = ++c; flash(e.currentTarget); const t = e.currentTarget; t.style.left = 200 + Math.random() * 70 + "px"; t.style.top = 10 + Math.random() * 40 + "px"; });
</script>
