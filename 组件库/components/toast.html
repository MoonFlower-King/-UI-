<button class="save">保存</button>
<div class="toast-zone" aria-live="polite"></div>

<style>
.save { border: 1px solid #E4E4E7; background: #fff; padding: 10px 24px; border-radius: 10px; font-size: 15px; cursor: pointer; }
.toast-zone { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { display: flex; gap: 8px; align-items: center; background: #18181B; color: #fff; padding: 10px 18px; white-space: nowrap;
  border-radius: 999px; font-size: 14px; animation: toast-in .25s ease-out, toast-out .25s ease-in 2.5s forwards; }
.toast i { width: 18px; height: 18px; border-radius: 50%; background: #34C759; display: grid; place-items: center; font-style: normal; font-size: 11px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(16px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
</style>

<script>
function showToast(message) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = "<i>✓</i>";
  t.append(message);
  document.querySelector(".toast-zone").appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
document.querySelector(".save").addEventListener("click", () => showToast("已保存"));
</script>
