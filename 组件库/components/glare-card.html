<div class="stage"><div class="gc"><small>JIANGYUE · MEMBER</small><b>江月会员</b><span>NO. 0815 · 2026</span><i class="glare"></i></div></div>
<style>
.stage { width: 320px; height: 240px; display: grid; place-items: center; perspective: 700px; background: #0B1020; border-radius: 14px; }
.gc { --x: 50%; --rx: 0deg; --ry: 0deg; position: relative; width: 240px; height: 150px; padding: 18px; box-sizing: border-box; border-radius: 14px; overflow: hidden; display: grid; align-content: space-between; color: #F5D9A8; background: radial-gradient(circle at 80% 20%, #3A2A12, transparent 60%), linear-gradient(135deg, #1A1A22, #2B2118); box-shadow: 0 20px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(245,217,168,.25); transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .15s; }
.gc small { font: 600 9px system-ui; letter-spacing: .2em; opacity: .7; }
.gc b { font: 700 24px "Songti SC","Noto Serif SC",serif; letter-spacing: .1em; }
.gc span { font: 11px ui-monospace, monospace; opacity: .7; }
.glare { position: absolute; inset: 0; background: linear-gradient(105deg, transparent calc(var(--x) - 18%), rgba(255,255,255,.5) var(--x), transparent calc(var(--x) + 18%)); mix-blend-mode: overlay; pointer-events: none; }
</style>
<script>
const c = document.querySelector(".gc"); let user = false;
function set(px, py) { c.style.setProperty("--x", px * 100 + "%"); c.style.setProperty("--ry", (px - .5) * 18 + "deg"); c.style.setProperty("--rx", (.5 - py) * 14 + "deg"); }
c.addEventListener("pointermove", e => { user = true; const r = c.getBoundingClientRect(); set((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); });
c.addEventListener("pointerleave", () => { user = false; });
(function loop(t) { if (!user) { const p = (Math.sin(t / 900) + 1) / 2; set(p, .5 + Math.cos(t / 900) * .2); } requestAnimationFrame(loop); })(0);
</script>
