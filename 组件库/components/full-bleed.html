<!--
{
  "en": "Full-bleed Layout", "zh": "通栏出血布局",
  "lead": "正文保持舒适的窄栏宽度，但某些图片或色块突破正文宽度、一直铺到屏幕两边。让长文章有呼吸感和节奏，不会从头到尾一个宽度。",
  "vague": ["图片想铺满整屏", "文章页太单调"],
  "terms": ["Full-bleed", "Breakout 突破栏宽", "Content Width 正文宽度"],
  "prompt": "文章页用 Full-bleed 布局：用 CSS Grid 三列 grid-template-columns: 1fr min(65ch, 100% - 32px) 1fr，所有子元素默认放中间列；需要通栏的图片/色块加 .full 放到 1 / -1；再加一档 .wide 比正文宽 120px；不用负 margin，也不会出现横向滚动条。"
}
-->
<div class="page">
  <article>
    <h3>江上夜色</h3>
    <p>正文保持在舒适的阅读宽度，一行不太长，眼睛不累。</p>
    <figure class="full"><span>月</span></figure>
    <p>图片突破正文宽度铺满两边，页面有了节奏。</p>
    <div class="wide">比正文宽一点的引用块</div>
    <p>然后又回到窄栏。</p>
  </article>
</div>

<style>
.page { width: 380px; height: 290px; overflow: hidden; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; }
article { display: grid; grid-template-columns: 1fr min(220px, 100% - 32px) 1fr; padding: 16px 0; }
article > * { grid-column: 2; }
.full { grid-column: 1 / -1; }
.wide { grid-column: 2; margin: 0 -30px; }
h3 { margin: 0 0 6px; font: 700 18px "Songti SC", serif; }
p { margin: 0 0 10px; font-size: 12px; line-height: 1.7; color: #3F3F46; }
figure { height: 90px; margin: 4px 0 12px; background: linear-gradient(180deg, #1E2A44, #0F1218 70%, #1E3A5F); display: grid; place-items: center; }
figure span { width: 36px; height: 36px; border-radius: 50%; background: #FFD58A; color: transparent; box-shadow: 0 0 30px rgba(255,213,138,.6); }
.wide { padding: 10px 14px; margin-bottom: 10px; border-left: 3px solid #FA8C16; background: #FFF8EF; font-size: 12px; color: #92400E; border-radius: 0 8px 8px 0; }
</style>
