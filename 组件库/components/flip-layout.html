<!--
{
  "en": "FLIP Layout Animation", "zh": "FLIP 布局过渡",
  "lead": "列表重新排序或筛选时，每个元素不是“啪”地跳到新位置，而是平滑滑过去。原理叫 FLIP：先记住旧位置，再算出新位置，用位移把差值补回来，然后放它飞过去。",
  "vague": ["排序后元素瞬间乱跳", "想让筛选有过渡"],
  "terms": ["FLIP (First, Last, Invert, Play)", "Layout Animation 布局动画", "Shared Element Transition"],
  "prompt": "作品网格的排序和筛选用 FLIP 动画：改变 DOM 前记录每个卡片 getBoundingClientRect（First），改变后再测一次（Last），把差值写成 transform 反向偏移（Invert），下一帧去掉 transform 并加 .4s cubic-bezier(.2,.8,.2,1) 过渡（Play）；被筛掉的卡片缩小淡出，新出现的卡片放大淡入。"
}
-->
<div class="fl"><nav><button class="on">乱序</button><button>按色相</button><button>只看暖色</button></nav><div class="grid"></div></div>
<style>
.fl { width: 300px; padding: 14px; box-sizing: border-box; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; }
nav { display: flex; gap: 6px; margin-bottom: 12px; }
nav button { font-size: 11px; padding: 4px 10px; border: 1px solid #E4E4E7; background: #fff; border-radius: 99px; cursor: pointer; color: #71717A; }
nav button.on { background: #18181B; border-color: #18181B; color: #fff; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; min-height: 104px; align-content: start; }
.grid i { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; font: 600 11px system-ui; color: rgba(0,0,0,.45); font-style: normal; }
.grid i.in { animation: in .4s cubic-bezier(.2,.8,.2,1); } @keyframes in { from { opacity: 0; transform: scale(.5); } }
</style>
<script>
const grid = document.querySelector(".grid"), btns = [...document.querySelectorAll("nav button")];
const all = Array.from({ length: 10 }, (_, i) => { const h = i * 36; const e = document.createElement("i"); e.style.background = `hsl(${h} 70% 78%)`; e.textContent = i + 1; e.h = h; return e; });
let mode = 0;
function order(m) { let list = [...all]; if (m === 0) list.sort(() => Math.random() - .5); if (m === 2) list = list.filter(e => e.h < 70 || e.h > 300); return list; }
function apply(m) {
  mode = m; btns.forEach((b, i) => b.classList.toggle("on", i === m));
  const first = new Map([...grid.children].map(e => [e, e.getBoundingClientRect()]));
  const next = order(m); grid.replaceChildren(...next);
  next.forEach(e => {
    const f = first.get(e); e.classList.remove("in");
    if (!f) { void e.offsetWidth; e.classList.add("in"); return; }
    const l = e.getBoundingClientRect();
    e.animate([{ transform: `translate(${f.left - l.left}px, ${f.top - l.top}px)` }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
}
btns.forEach((b, i) => b.onclick = () => apply(i));
grid.replaceChildren(...order(0)); setInterval(() => apply((mode + 1) % 3), 2200);
</script>
