<div class="cm">
  <p><b>白露</b>这个配色好舒服，像夜里的江面。</p>
  <div class="rx"><span class="list"></span><span class="pk"><button class="add" aria-label="添加表情回应">☺＋</button><span class="bar" hidden></span></span></div>
</div>

<style>
.cm { width: 300px; padding: 14px; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; }
p { margin: 0 0 10px; font-size: 13px; color: #3F3F46; } p b { margin-right: 6px; color: #18181B; }
.rx { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .list { display: contents; }
.pill { display: inline-flex; gap: 4px; align-items: center; height: 26px; padding: 0 8px; border: 1px solid #E4E4E7; border-radius: 999px; background: #fff; font-size: 13px; cursor: pointer; animation: pop .2s cubic-bezier(.34, 1.56, .64, 1); }
.pill small { font-size: 12px; color: #52525B; font-variant-numeric: tabular-nums; }
.pill.mine { background: #FFF4E6; border-color: #FA8C16; } .pill.mine small { color: #C2410C; }
.pk { position: relative; }
.add { height: 26px; padding: 0 8px; border: 1px dashed #D4D4D8; border-radius: 999px; background: none; font-size: 12px; color: #71717A; cursor: pointer; }
.bar { position: absolute; bottom: 34px; left: -10px; display: flex; gap: 2px; padding: 5px 8px; border-radius: 999px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.14); animation: pop .15s ease-out; }
.bar button { border: 0; background: none; font-size: 20px; cursor: pointer; transition: transform .15s; } .bar button:hover { transform: scale(1.3) translateY(-3px); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
</style>

<script>
const E = ["👍", "😂", "😍", "🎉", "🤔", "🌙"], count = { "👍": 2, "🌙": 1 }, mine = new Set();
const list = document.querySelector(".list"), bar = document.querySelector(".bar");
bar.innerHTML = E.map((e) => `<button>${e}</button>`).join("");
const render = () => (list.innerHTML = Object.entries(count).filter(([, n]) => n > 0).map(([e, n]) => `<button class="pill ${mine.has(e) ? "mine" : ""}" data-e="${e}">${e}<small>${n}</small></button>`).join(""));
const toggle = (e) => { if (mine.has(e)) { mine.delete(e); count[e]--; } else { mine.add(e); count[e] = (count[e] || 0) + 1; } render(); };
document.querySelector(".add").addEventListener("click", (e) => { e.stopPropagation(); bar.hidden = !bar.hidden; });
bar.addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") { toggle(e.target.textContent); bar.hidden = true; } });
list.addEventListener("click", (e) => { const p = e.target.closest(".pill"); if (p) toggle(p.dataset.e); });
document.addEventListener("click", (e) => { if (!e.target.closest(".pk")) bar.hidden = true; });
render();
</script>
