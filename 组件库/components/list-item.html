<ul class="list">
  <li><i style="background:#FA8C16">🔔</i><div><b>通知</b><small>新作品、评论和关注提醒</small></div><span class="tg on"></span></li>
  <li><i style="background:#2563EB">◐</i><div><b>外观</b><small>跟随系统</small></div><em>›</em></li>
  <li><i style="background:#16A34A">⇣</i><div><b>存储空间</b><small>已用 2.4 GB</small></div><em>›</em></li>
</ul>

<style>
.list { width: 300px; margin: 0; padding: 4px 0; list-style: none; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; }
li { position: relative; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; cursor: pointer; transition: background .15s; }
li:hover { background: #FAFAFA; } li:active { background: #F4F4F5; }
li + li::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: #F0F0F2; }
i { width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 14px; }
div { flex: 1; min-width: 0; display: grid; } b { font-size: 14px; font-weight: 500; color: #18181B; } small { font-size: 12px; color: #A1A1AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
em { font-style: normal; color: #D4D4D8; font-size: 20px; }
.tg { width: 40px; height: 24px; border-radius: 12px; background: #E4E4E7; position: relative; transition: background .2s; flex: none; }
.tg::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.tg.on { background: #FA8C16; } .tg.on::after { transform: translateX(16px); }
</style>

<script>
document.querySelector(".tg").closest("li").addEventListener("click", (e) => e.currentTarget.querySelector(".tg").classList.toggle("on"));
</script>
