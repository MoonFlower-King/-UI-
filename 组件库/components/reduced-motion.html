<!--
{
  "en": "Reduced Motion",
  "zh": "减少动效",
  "lead": "有些人看到大幅动画会头晕。系统开了“减少动态效果”时，网页应该关掉或减弱动画。右边是开启后的样子。",
  "prompt": "尊重 Reduced Motion：在 @media (prefers-reduced-motion: reduce) 里关闭视差、自动轮播和大幅位移动画，只保留淡入淡出。"
}
-->
<div class="rm">
  <figure><div class="box"><i class="full"></i></div><figcaption>正常动效</figcaption></figure>
  <figure><div class="box"><i class="calm"></i></div><figcaption>Reduced Motion</figcaption></figure>
</div>

<style>
.rm { display: flex; gap: 16px; } .rm figure { margin: 0; display: grid; gap: 8px; justify-items: center; } .rm figcaption { font-size: 12px; color: #71717A; }
.box { width: 120px; height: 120px; border-radius: 16px; background: #fff; border: 1px solid #E4E4E7; display: grid; place-items: center; }
.box i { width: 40px; height: 40px; border-radius: 12px; background: #FA8C16; }
.full { animation: wild 1.4s ease-in-out infinite; }
.calm { animation: soft 1.4s ease-in-out infinite; }
@keyframes wild { 50% { transform: translate(30px, -25px) rotate(180deg) scale(1.3); } }
@keyframes soft { 50% { opacity: .4; } }
/* 真实项目里这样写：系统开启“减少动态效果”时自动切换 */
@media (prefers-reduced-motion: reduce) { .full { animation-name: soft; } }
</style>
