<!--
{
  "en": "Optimistic UI",
  "zh": "乐观更新",
  "lead": "点了之后先假设成功、立刻更新界面，再在后台发请求，失败了再撤回。用户感觉“秒响应”。对比两个点赞按钮。",
  "prompt": "点赞用 Optimistic UI：点击后立刻变红、数字加 1、心形弹跳，同时后台发请求；请求失败时恢复原状并弹出“点赞失败，请重试”。"
}
-->
<div class="ou">
  <figure><button class="like slow">♡ <span>128</span></button><figcaption>等服务器（1 秒后才变）</figcaption></figure>
  <figure><button class="like fast">♡ <span>128</span></button><figcaption>Optimistic UI（立刻变）</figcaption></figure>
</div>

<style>
.ou { display: flex; gap: 16px; } .ou figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
.ou figcaption { font-size: 11px; color: #71717A; }
.like { border: 1px solid #E4E4E7; background: #fff; border-radius: 99px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
.like.on { color: #FF2D55; border-color: #FFDFE6; background: #FFF1F4; }
.like.pop { animation: pop .35s cubic-bezier(.34,1.8,.64,1); }
.like.wait { opacity: .5; }
@keyframes pop { 40% { transform: scale(1.15); } }
</style>
<script>
const fakeRequest = () => new Promise(r => setTimeout(r, 1000));
function toggle(b) { const on = b.classList.toggle("on"); const s = b.querySelector("span"); s.textContent = +s.textContent + (on ? 1 : -1); b.firstChild.textContent = on ? "♥ " : "♡ "; }
document.querySelector(".slow").onclick = async e => { const b = e.currentTarget; b.classList.add("wait"); await fakeRequest(); b.classList.remove("wait"); toggle(b); };
document.querySelector(".fast").onclick = e => { const b = e.currentTarget; toggle(b); b.classList.remove("pop"); b.offsetWidth; b.classList.add("pop"); fakeRequest(); };
</script>
