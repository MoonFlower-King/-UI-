<style>

.ins input:focus { background: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,.04), 0 0 0 3px #FFE7BA; border-color: #FA8C16; }

.track i { display: block; height: 100%; width: 62%; border-radius: 99px; background: #FA8C16; }
