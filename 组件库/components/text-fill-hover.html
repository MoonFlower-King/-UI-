<nav><a>作品</a><a>组件</a><a>关于</a></nav>

<style>
nav { display: grid; gap: 4px; }
a { font: 800 44px/1.15 "Songti SC", "Noto Serif SC", serif; cursor: pointer; color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(90deg, #FA8C16 50%, #D4D4D8 50%); background-size: 200% 100%; background-position: 100% 0; transition: background-position .4s cubic-bezier(.7, 0, .3, 1); }
a:hover, a.demo { background-position: 0 0; }
</style>
<script>
const links = [...document.querySelectorAll("a")]; let i = 0, user = false;
document.querySelector("nav").addEventListener("pointerenter", () => { user = true; links.forEach(a => a.classList.remove("demo")); });
document.querySelector("nav").addEventListener("pointerleave", () => user = false);
setInterval(() => { if (user) return; links.forEach(a => a.classList.remove("demo")); links[i++ % links.length].classList.add("demo"); }, 1100);
</script>
