<!--
{
  "en": "Confirm Dialog", "zh": "确认对话框",
  "lead": "删除、退出这类做了就难撤回的操作，先弹一个小对话框确认：标题直说后果、按钮写清楚动作（“删除”而不是“确定”），危险按钮用红色，默认焦点放在“取消”上。",
  "vague": ["删除前确认一下", "二次确认弹窗"],
  "terms": ["Alert Dialog", "Confirmation 二次确认", "Destructive Action", "Focus Trap 焦点锁定"],
  "prompt": "删除前弹 Confirm Dialog：背景 40% 黑色遮罩淡入，360px 白色对话框从 0.96 缩放弹出（200ms ease-out）；顶部红色浅底圆形警告图标，标题“删除这个作品？”，说明“删除后 30 天内可在回收站恢复”；底部右对齐两个按钮：描边“取消”（默认聚焦）和红色实心“删除”；Esc 和点遮罩都能取消。"
}
-->
<div class="wrap">
  <button class="trigger">删除作品</button>
  <div class="mask open">
    <div class="dlg" role="alertdialog" aria-modal="true">
      <i>!</i>
      <h3>删除这个作品？</h3>
      <p>删除后 30 天内可以在回收站恢复，之后将永久删除。</p>
      <div class="act"><button class="cancel">取消</button><button class="ok">删除</button></div>
    </div>
  </div>
</div>

<style>
.wrap { position: relative; width: 340px; height: 260px; display: grid; place-items: center; }
.trigger { border: 1px solid #FCA5A5; background: #fff; color: #DC2626; height: 38px; padding: 0 16px; border-radius: 10px; cursor: pointer; }
.mask { position: absolute; inset: 0; border-radius: 16px; background: rgba(0,0,0,.4); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
.mask.open { opacity: 1; pointer-events: auto; }
.dlg { width: 280px; background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.25); transform: scale(.96); transition: transform .2s ease-out; }
.open .dlg { transform: none; }
.dlg i { width: 36px; height: 36px; border-radius: 50%; background: #FEE2E2; color: #DC2626; display: grid; place-items: center; font: normal 700 18px sans-serif; }
h3 { margin: 12px 0 4px; font-size: 16px; } p { margin: 0; font-size: 12px; color: #71717A; line-height: 1.6; }
.act { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.act button { height: 34px; padding: 0 14px; border-radius: 9px; font-size: 13px; cursor: pointer; }
.cancel { border: 1px solid #E4E4E7; background: #fff; } .cancel:focus-visible { outline: 2px solid #FA8C16; outline-offset: 2px; }
.ok { border: 0; background: #DC2626; color: #fff; font-weight: 600; } .ok:hover { background: #B91C1C; }
</style>
<script>
const mask = document.querySelector(".mask"), trigger = document.querySelector(".trigger");
const close = () => { mask.classList.remove("open"); trigger.focus(); };
trigger.addEventListener("click", () => { mask.classList.add("open"); document.querySelector(".cancel").focus(); });
document.querySelector(".ok").addEventListener("click", () => { trigger.textContent = "已删除"; trigger.disabled = true; close(); setTimeout(() => { trigger.textContent = "删除作品"; trigger.disabled = false; }, 2000); });
document.querySelector(".cancel").addEventListener("click", close);
mask.addEventListener("click", (e) => e.target === mask && close());
document.addEventListener("keydown", (e) => e.key === "Escape" && close());
</script>
