<!--
{
  "en": "Reading Progress Bar", "zh": "阅读进度条",
  "lead": "长文章顶部一根细线，随着往下读慢慢变长，读到底就满了。让读者知道“还剩多少”，不至于读一半放弃。",
  "vague": ["文章太长看不到头", "不知道读到哪了"],
  "terms": ["Reading Progress", "Scroll Progress Indicator", "Scroll-linked"],
  "prompt": "文章页顶部加 Reading Progress Bar：固定在顶部、高 3px、江月橘 #FA8C16，宽度 = 已滚动距离 / (内容高度 − 视口高度)；用 transform: scaleX 而不是改 width，保证滚动流畅；读完时右侧显示一个小勾。"
}
-->
<div class="reader">
  <div class="bar"><i></i></div>
  <article>
    <h3>夜游江边</h3>
    <p>月亮从东边的山后升起来，在江面上铺开一条碎金。</p><p>风不大，船也不急，桨声一下一下，像在数时间。</p>
    <p>岸边的灯一盏一盏亮起，倒影被水揉碎，又慢慢拼回去。</p><p>有人在船头煮茶，水汽升起来，把月光也染得温温的。</p>
    <p>远处传来几声笛子，听不清曲调，只觉得很长。</p><p>船靠岸的时候，月亮已经升到头顶了。</p><p class="end">— 完 —</p>
  </article>
</div>

<style>
.reader { position: relative; width: 300px; height: 230px; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; overflow: hidden; }
.bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #F4F4F5; z-index: 1; }
.bar i { display: block; height: 100%; background: #FA8C16; transform: scaleX(0); transform-origin: left; }
article { height: 100%; overflow-y: auto; padding: 18px 20px; box-sizing: border-box; scrollbar-width: none; }
h3 { margin: 0 0 10px; font: 700 18px/1.3 "Songti SC", serif; }
p { margin: 0 0 12px; font-size: 13px; line-height: 1.8; color: #3F3F46; }
.end { text-align: center; color: #A1A1AA; }
</style>

<script>
const art = document.querySelector("article"), bar = document.querySelector(".bar i");
art.addEventListener("scroll", () => {
  const p = art.scrollTop / (art.scrollHeight - art.clientHeight);
  bar.style.transform = `scaleX(${Math.min(1, p)})`;
}, { passive: true });
</script>
