  "en": "Number Ticker",

  "lead": "数据出现时从 0 快速“跑”到目标值，最后放慢停下。官网首页的“服务 10,000+ 用户”常用这招，让数字更有分量。",
  "prompt": "数据统计区用 Number Ticker：进入视口时数字在 1.6s 内从 0 增长到目标值，easeOutExpo 缓动（先快后慢），千分位分隔，等宽数字防抖动，单位和数字分开排版。"
}

<div class="stats">
  <div><b data-to="12800">0</b><span>位设计师在用</span></div>
  <div><b data-to="98.6" data-dec="1">0</b><em>%</em><span>满意度</span></div>
  <div><b data-to="124">0</b><span>个界面术语</span></div>
</div>

<style>
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(420px, 92vw); }
.stats div { padding: 16px 8px; text-align: center; background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.05); }
.stats b { font-size: clamp(22px, 6vw, 30px); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stats em { font-style: normal; font-size: 16px; font-weight: 600; color: #FA8C16; }
.stats span { display: block; margin-top: 4px; font-size: 12px; color: #71717A; }
</style>
<script>
const ease = t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
function run(el) {
  const to = +el.dataset.to, dec = +(el.dataset.dec || 0), start = performance.now();
  (function step(now) {
    const p = Math.min((now - start) / 1600, 1);
    el.textContent = (to * ease(p)).toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
    if (p < 1) requestAnimationFrame(step);
  })(start);
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(e.target); io.unobserve(e.target); } }));
document.querySelectorAll("[data-to]").forEach(el => io.observe(el));
</script>
