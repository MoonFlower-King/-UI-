<p class="hl-p">好的界面不是堆砌装饰，而是<mark>层次清楚</mark>、<mark>留白充足</mark>，再加一点<mark>恰到好处的动效</mark>。</p>

<style>
.hl-p { max-width: min(340px, 88vw); margin: 0; font-size: 19px; line-height: 1.9; color: #27272A; }
.hl-p mark { color: inherit; background: linear-gradient(transparent 58%, rgba(250,140,22,.35) 58%, rgba(250,140,22,.35) 92%, transparent 92%) no-repeat 0 0 / 0% 100%; padding: 0 2px; transition: background-size .8s ease-out; }
.hl-p mark.on { background-size: 100% 100%; }
</style>
<script>
const marks = document.querySelectorAll(".hl-p mark");
new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) marks.forEach((m, i) => setTimeout(() => m.classList.add("on"), 300 + i * 500));
})).observe(document.querySelector(".hl-p"));
</script>
