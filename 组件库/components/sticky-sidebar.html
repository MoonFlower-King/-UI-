  "lead": "长页面滚动时，侧边的目录或购买按钮一直“粘”在屏幕上，不会跟着内容跑走。看文档、看商品详情时随时能跳转、随时能下单。",
  "vague": ["侧边目录滚着滚着就没了", "购买按钮一直跟着"],

  "prompt": "文档页右侧目录做 Sticky Sidebar：position: sticky; top: 80px（避开顶部导航），最大高度 calc(100vh - 100px) 超出可滚动；滚动正文时用 IntersectionObserver 高亮当前小节，左侧 2px 江月橘竖条平滑移动到当前项。"
}

<div class="doc">
  <article>
    <section id="a"><h4>安装</h4><p></p><p></p><p class="s"></p></section>
    <section id="b"><h4>快速开始</h4><p></p><p class="s"></p><p></p><p></p></section>
    <section id="c"><h4>主题定制</h4><p></p><p></p><p class="s"></p></section>
    <section id="d"><h4>常见问题</h4><p></p><p class="s"></p><p></p><p></p><p></p></section>
  </article>
  <nav><small>本页目录</small><a href="#a">安装</a><a href="#b">快速开始</a><a href="#c">主题定制</a><a href="#d">常见问题</a></nav>
</div>

<style>
.doc { display: grid; grid-template-columns: 1fr 100px; gap: 16px; width: 360px; height: 240px; overflow-y: auto; padding: 0 14px; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; scrollbar-width: thin; }
section { padding: 14px 0 6px; } h4 { margin: 0 0 8px; font-size: 14px; }
p { height: 8px; margin: 0 0 8px; border-radius: 4px; background: #F4F4F5; } .s { width: 60%; }
nav { position: sticky; top: 0; align-self: start; display: grid; gap: 2px; padding-top: 14px; }
small { font-size: 11px; color: #A1A1AA; margin-bottom: 4px; }
a { padding: 4px 8px; border-left: 2px solid #F4F4F5; font-size: 12px; color: #71717A; text-decoration: none; transition: .2s; }
a.on { border-color: #FA8C16; color: #18181B; font-weight: 600; }
</style>

<script>
const doc = document.querySelector(".doc"), links = [...document.querySelectorAll("nav a")];
const on = (id) => links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + id));
const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && on(e.target.id)), { root: doc, rootMargin: "0px 0px -70% 0px" });
document.querySelectorAll("section").forEach((s) => io.observe(s));
links.forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); doc.querySelector(a.getAttribute("href")).scrollIntoView({ behavior: "smooth", block: "start" }); }));
on("a");
</script>
