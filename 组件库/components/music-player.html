<div class="mp">
  <div class="eq"><i></i><i></i><i></i><i></i></div>
  <div class="disc"><span>江</span></div>
  <h3>江上明月</h3><p>江月 UI · 夜航</p>
  <input type="range" value="32">
  <div class="time"><span>1:12</span><span>3:45</span></div>
  <div class="ctl"><button>⏮</button><button class="play">▶</button><button>⏭</button></div>
</div>

<style>
.mp { position: relative; width: 240px; padding: 22px 20px 18px; border-radius: 20px; background: #18181B; color: #fff; text-align: center; }
.disc { width: 116px; height: 116px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle, #18181B 0 12%, transparent 13%), conic-gradient(from 30deg, #FA8C16, #FDE68A, #1E3A5F, #FA8C16); display: grid; place-items: center; animation: spin 12s linear infinite paused; box-shadow: 0 10px 30px rgba(250,140,22,.25); }
.disc span { font: 600 13px serif; color: #FDE68A; }
.mp.on .disc, .mp.on .eq i { animation-play-state: running; }
@keyframes spin { to { transform: rotate(1turn); } }
h3 { margin: 16px 0 2px; font-size: 16px; } p { margin: 0 0 10px; font-size: 12px; color: #A1A1AA; }
input { width: 100%; appearance: none; height: 4px; border-radius: 4px; background: linear-gradient(#FA8C16, #FA8C16) 0 / var(--p, 32%) 100% no-repeat, #3F3F46; cursor: pointer; }
input::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
.time { display: flex; justify-content: space-between; font-size: 10px; color: #71717A; margin-top: 4px; font-variant-numeric: tabular-nums; }
.ctl { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 8px; }
.ctl button { border: 0; background: none; color: #D4D4D8; font-size: 18px; cursor: pointer; }
.ctl .play { width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #18181B; font-size: 18px; transition: transform .15s; }
.ctl .play:active { transform: scale(.92); }
.eq { position: absolute; top: 16px; right: 16px; display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.eq i { width: 3px; height: 100%; background: #FA8C16; border-radius: 2px; transform-origin: bottom; transform: scaleY(.3); animation: eq .8s ease-in-out infinite alternate paused; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } .eq i:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
</style>
<script>
const mp = document.querySelector(".mp"), play = document.querySelector(".play"), bar = document.querySelector("input"), now = document.querySelector(".time span");
const paint = () => { bar.style.setProperty("--p", bar.value + "%"); const s = Math.round(225 * bar.value / 100); now.textContent = `${s / 60 | 0}:${String(s % 60).padStart(2, "0")}`; };
bar.addEventListener("input", paint);
play.addEventListener("click", () => { const on = mp.classList.toggle("on"); play.textContent = on ? "❚❚" : "▶"; });
setInterval(() => { if (mp.classList.contains("on") && +bar.value < 100) { bar.value = +bar.value + .5; paint(); } }, 250);
paint();
</script>
