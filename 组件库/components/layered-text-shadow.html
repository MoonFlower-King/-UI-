<div class="wrap"><h2>GOOD<br>NIGHT</h2></div>
<style>
.wrap { display: grid; place-items: center; width: 300px; height: 200px; border-radius: 16px; background: #1E293B; }
h2 { margin: 0; font: 900 52px/0.95 "Arial Black", Impact, sans-serif; letter-spacing: .02em; color: #FFF7ED; text-align: center; cursor: default;
  --d: 3px; text-shadow: var(--d) var(--d) 0 #FDBA74, calc(var(--d) * 2) calc(var(--d) * 2) 0 #FB923C, calc(var(--d) * 3) calc(var(--d) * 3) 0 #EA580C, calc(var(--d) * 4) calc(var(--d) * 4) 0 #7C2D12;
  transition: --d .2s, transform .2s; }
@property --d { syntax: "<length>"; inherits: true; initial-value: 3px; }
h2:hover { --d: 5px; transform: translate(-4px, -4px); }
</style>
