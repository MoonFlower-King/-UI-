  "vague": ["配色要和谐不刺眼", "几个颜色怎么搭"],

}
-->
<div class="wrap">
  <svg viewBox="-60 -60 120 120" class="wheel"></svg>
  <div class="demo"><span style="background:#F4664A"></span><span style="background:#FA8C16"></span><span style="background:#F5B800"></span><p>相邻 ±30°，温暖统一</p></div>
</div>

<style>
.wrap { display: flex; align-items: center; gap: 22px; }
.wheel { width: 150px; overflow: visible; }
.wheel .arc { transition: transform .3s; transform-origin: center; }
.wheel .pick { stroke: #18181B; stroke-width: 2; }
.demo { display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
.demo span { height: 70px; border-radius: 10px; }
.demo span:nth-child(2) { height: 90px; margin-top: -10px; }
.demo p { grid-column: 1 / -1; margin: 6px 0 0; font-size: 12px; color: #71717A; }
</style>

<script>
const svg = document.querySelector(".wheel"), N = 12;
const seg = (i) => { const a0 = ((i * 30 - 15 - 90) * Math.PI) / 180, a1 = ((i * 30 + 15 - 90) * Math.PI) / 180, R = 55, r = 30;
  const p = (a, rr) => `${(rr * Math.cos(a)).toFixed(2)} ${(rr * Math.sin(a)).toFixed(2)}`;
  return `M${p(a0, R)} A${R} ${R} 0 0 1 ${p(a1, R)} L${p(a1, r)} A${r} ${r} 0 0 0 ${p(a0, r)}Z`; };
svg.innerHTML = Array.from({ length: N }, (_, i) => `<path class="arc${[0, 1, 2].includes(i) ? " pick" : ""}" d="${seg(i)}" fill="hsl(${i * 30 + 0} 85% 58%)" opacity="${[0, 1, 2].includes(i) ? 1 : .25}"/>`).join("")
  + '<text x="0" y="4" text-anchor="middle" font-size="9" fill="#71717A">邻近色</text>';
</script>
