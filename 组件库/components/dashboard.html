<!--
{
  "en": "Dashboard", "zh": "仪表盘",
  "lead": "后台首页的标准长相：左侧窄导航，顶部几张数据卡（大数字 + 涨跌），下面一张图表和一份最近列表。关键是“先看数字，再看趋势，最后看明细”。",
  "vague": ["后台太丑", "数据看不过来"],
  "terms": ["Stat Card 数据卡", "Sidebar 侧边栏", "Chart 图表", "Information Density 信息密度"],
  "prompt": "做一个 Dashboard：左侧 56px 图标侧边栏，当前项品牌色底；右侧顶部 3 张 Stat Card（小字标题、28px 等宽大数字、绿色/红色涨跌箭头百分比）；下面左边柱状图卡片（柱子从底部依次长出，间隔 60ms），右边最近订单列表；背景 #F4F4F5，卡片白底圆角 12px、细边框，间距统一 12px。"
}
-->
<div class="dash">
  <nav><b>月</b><i class="on">▦</i><i>◷</i><i>☰</i><i>⚙</i></nav>
  <main>
    <div class="stats">
      <div class="s"><small>今日访客</small><b>2,846</b><em class="up">↑ 12%</em></div>
      <div class="s"><small>订单</small><b>318</b><em class="up">↑ 4%</em></div>
      <div class="s"><small>退款</small><b>9</b><em class="down">↓ 2%</em></div>
    </div>
    <div class="row">
      <div class="card chart"><small>近 7 天</small><div class="bars"></div></div>
      <div class="card list"><small>最近订单</small><p><span>江小月</span><b>¥320</b></p><p><span>林一舟</span><b>¥86</b></p><p><span>苏白</span><b>¥1,250</b></p></div>
    </div>
  </main>
</div>

<style>
.dash { display: flex; width: 380px; height: 250px; background: #F4F4F5; border-radius: 14px; overflow: hidden; border: 1px solid #E4E4E7; font-size: 12px; }
nav { width: 46px; background: #fff; border-right: 1px solid #E4E4E7; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 12px; }
nav b { width: 26px; height: 26px; border-radius: 8px; background: #18181B; color: #fff; display: grid; place-items: center; font: 600 13px serif; margin-bottom: 6px; }
nav i { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; font-style: normal; color: #A1A1AA; cursor: pointer; }
nav i:hover { background: #F4F4F5; } nav i.on { background: #FFF4E6; color: #FA8C16; }
main { flex: 1; padding: 12px; display: grid; gap: 10px; grid-template-rows: auto 1fr; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.s, .card { background: #fff; border: 1px solid #E4E4E7; border-radius: 10px; padding: 9px 10px; }
.s { display: grid; gap: 2px; } small { color: #71717A; font-size: 11px; }
.s b { font-size: 19px; font-variant-numeric: tabular-nums; } em { font-style: normal; font-size: 11px; } .up { color: #16A34A; } .down { color: #DC2626; }
.row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 92px; margin-top: 8px; }
.bars i { flex: 1; background: #FED7AA; border-radius: 4px 4px 0 0; transform-origin: bottom; animation: grow .6s cubic-bezier(.22,1,.36,1) backwards; }
.bars i:last-child { background: #FA8C16; }
@keyframes grow { from { transform: scaleY(0); } }
.list p { margin: 8px 0 0; display: flex; justify-content: space-between; } .list b { font-variant-numeric: tabular-nums; }
</style>
<script>
const bars = document.querySelector(".bars");
const draw = () => { bars.innerHTML = [42, 60, 38, 75, 55, 82, 96].map((h, i) => `<i style="height:${h}%;animation-delay:${i * 60}ms"></i>`).join(""); };
draw();
document.querySelectorAll("nav i").forEach((n) => n.addEventListener("click", () => { document.querySelectorAll("nav i").forEach((x) => x.classList.toggle("on", x === n)); draw(); }));
</script>
