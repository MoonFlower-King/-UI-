<div class="wrap">
  <figure class="cover"><figcaption><b>夏夜江边音乐会</b><small>8 月 20 日 · 免费入场</small></figcaption></figure>
  <label><input type="checkbox" checked> 开启渐变遮罩</label>
</div>

<style>
.wrap { display: grid; gap: 10px; justify-items: center; }
.cover { position: relative; width: 320px; height: 200px; margin: 0; border-radius: 14px; overflow: hidden;
  background: radial-gradient(circle at 30% 70%, #FFF3C4, transparent 40%), radial-gradient(circle at 80% 85%, #FDE68A, transparent 35%), linear-gradient(160deg, #FDBA74, #F9A8D4 60%, #FEF3C7); }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.7), transparent 60%); transition: opacity .3s; }
.wrap:has(input:not(:checked)) .cover::after { opacity: 0; }
figcaption { position: absolute; left: 18px; bottom: 16px; z-index: 1; display: grid; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
b { font: 700 22px "Songti SC", serif; } small { font-size: 12px; opacity: .85; }
label { font-size: 12px; color: #71717A; display: flex; gap: 6px; align-items: center; } input { accent-color: #FA8C16; }
</style>
