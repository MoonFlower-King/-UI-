<!--
{
  "en": "FAB",
  "zh": "悬浮按钮",
  "lead": "Floating Action Button，固定在屏幕右下角的圆形主按钮。点开还能展开几个子操作。",
  "prompt": "手机端右下角加 FAB：56px 圆形品牌色，带大阴影；点击后 + 旋转 45 度变 ×，向上依次弹出 3 个小按钮（交错 50ms）。"
}
-->
<div class="screen">
  <div class="fab-wrap">
    <button class="sub" style="--i:3">📷</button><button class="sub" style="--i:2">📝</button><button class="sub" style="--i:1">📎</button>
    <button class="fab">+</button>
  </div>
</div>

<style>
.screen { position: relative; width: 200px; height: 260px; border-radius: 22px; background: #F4F4F5; border: 6px solid #18181B; overflow: hidden; }
.fab-wrap { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.fab { width: 52px; height: 52px; border-radius: 50%; border: 0; background: #FA8C16; color: #fff; font-size: 28px; cursor: pointer;
  box-shadow: 0 8px 20px rgba(250,140,22,.45); transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.sub { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.12); font-size: 16px; cursor: pointer;
  opacity: 0; transform: translateY(20px) scale(.6); transition: .25s cubic-bezier(.34,1.56,.64,1); transition-delay: calc((3 - var(--i)) * 0ms); }
.fab-wrap.open .fab { transform: rotate(45deg); }
.fab-wrap.open .sub { opacity: 1; transform: none; transition-delay: calc(var(--i) * 50ms); }
</style>
<script>
document.querySelector(".fab").onclick = () => document.querySelector(".fab-wrap").classList.toggle("open");
</script>
