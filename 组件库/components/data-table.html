<!--
{
  "en": "Data Table",
  "zh": "数据表格",
  "lead": "专业的表格不只是画格子：表头可点击排序、数字右对齐、隔行浅色、鼠标所在行高亮、状态用彩色小标签。点表头试试。",
  "prompt": "订单列表用 Data Table：表头可点击排序并显示 ↑↓ 箭头，数字列右对齐且用等宽数字，行高 44px，悬停行浅灰底，状态列用彩色圆角标签，表格外层圆角卡片带细边框。"
}
-->
<div class="tbl">
  <table>
    <thead><tr><th data-k="name">客户</th><th data-k="amount" class="num">金额</th><th data-k="status">状态</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<style>
.tbl { width: min(340px, 90vw); background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; overflow: hidden; font-size: 13px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 14px; background: #FAFAFA; color: #71717A; font-weight: 500; border-bottom: 1px solid #E4E4E7; cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: #18181B; } th.asc::after { content: " ↑"; color: #FA8C16; } th.desc::after { content: " ↓"; color: #FA8C16; }
td { padding: 0 14px; height: 40px; border-bottom: 1px solid #F4F4F5; }
tr:last-child td { border-bottom: 0; } tbody tr:hover { background: #FAFAFA; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.st { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
.st.paid { background: #DCFCE7; color: #15803D; } .st.wait { background: #FEF3C7; color: #B45309; } .st.fail { background: #FEE2E2; color: #B91C1C; }
</style>
<script>
const rows = [["江小月", 3280, "paid"], ["林一舟", 860, "wait"], ["苏白", 12500, "paid"], ["陈拾", 420, "fail"], ["周远", 1990, "wait"]];
const label = { paid: "已付款", wait: "待付款", fail: "已取消" }, tbody = document.querySelector("tbody");
const render = () => tbody.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td class="num">¥${r[1].toLocaleString()}</td><td><span class="st ${r[2]}">${label[r[2]]}</span></td></tr>`).join("");
document.querySelectorAll("th").forEach((th, col) => th.addEventListener("click", () => {
  const dir = th.classList.contains("asc") ? -1 : 1;
  document.querySelectorAll("th").forEach(h => h.classList.remove("asc", "desc")); th.classList.add(dir > 0 ? "asc" : "desc");
  rows.sort((a, b) => (a[col] > b[col] ? 1 : -1) * dir); render();
}));
render(); setTimeout(() => document.querySelectorAll("th")[1].click(), 800);
</script>
