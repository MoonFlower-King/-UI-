<!--
{
  "en": "Announcement Bar", "zh": "顶部公告条",
  "lead": "网站最顶上一条窄窄的横幅，用来说一件全站都该知道的事：新功能上线、活动开始、维护通知。可以关掉，关掉后记住不再出现。",
  "vague": ["顶上那条通知", "想让所有人都看到"],
  "terms": ["Announcement Bar", "Banner", "Dismissible 可关闭"],
  "prompt": "页面最顶部加 Announcement Bar：高 40px，深色底 #18181B、白字 13px 居中，前面一个江月橘小标签“新”，后面一个带下划线的“了解更多 →”；右侧 × 关闭按钮，关闭时高度 200ms 收起，并用 localStorage 记住不再显示。"
}
-->
<div class="page">
  <div class="ann" role="region" aria-label="公告">
    <p><b>新</b>江月 UI 新增「数据展示」主题 · <a href="#">了解更多 →</a></p>
    <button aria-label="关闭公告">×</button>
  </div>
  <nav><span class="logo">江月</span><span>文档</span><span>组件</span><span>价格</span></nav>
  <div class="body"><i></i><i></i><i class="s"></i></div>
</div>

<style>
.page { width: 360px; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; overflow: hidden; }
.ann { display: grid; grid-template-columns: 1fr 32px; align-items: center; background: #18181B; color: #fff; height: 40px; overflow: hidden; transition: height .2s ease; }
.ann.gone { height: 0; }
.ann p { margin: 0; padding-left: 32px; text-align: center; font-size: 12px; white-space: nowrap; }
.ann b { display: inline-block; margin-right: 8px; padding: 1px 6px; border-radius: 4px; background: #FA8C16; font-size: 11px; }
.ann a { color: #fff; text-underline-offset: 3px; }
.ann button { border: 0; background: none; color: #A1A1AA; font-size: 18px; cursor: pointer; }
.ann button:hover { color: #fff; }
nav { display: flex; gap: 16px; align-items: center; padding: 12px 16px; font-size: 12px; color: #71717A; border-bottom: 1px solid #F4F4F5; }
.logo { font-weight: 700; color: #18181B; margin-right: auto; }
.body { padding: 16px; display: grid; gap: 8px; }
.body i { height: 10px; border-radius: 4px; background: #F4F4F5; } .body .s { width: 60%; }
</style>

<script>
const ann = document.querySelector(".ann");
document.querySelector(".ann button").addEventListener("click", () => {
  ann.classList.add("gone");
  // 真实项目里用 localStorage.setItem("ann-closed", "1") 记住，下次不再显示；演示里 3 秒后放回来
  setTimeout(() => ann.classList.remove("gone"), 3000);
});
</script>
