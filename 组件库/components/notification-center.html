  "en": "Notification Center", "zh": "通知中心",
  "lead": "点铃铛弹出通知面板：未读的条目左边有小蓝点、底色略深，点一下变已读；铃铛上的红色数字跟着减少，全部读完数字消失。顶部有“全部已读”。",
  "vague": ["消息提醒怎么做", "小铃铛"],
  "terms": ["Notification Badge 未读角标", "Unread Indicator 未读圆点", "Mark All as Read 全部已读", "Popover"],
  "prompt": "做 Notification Center：铃铛图标按钮右上角红色数字角标；点击后下方弹出 280px 宽面板（圆角 14px、Layered Elevation、从上方 8px 淡入）；面板头部“通知”+ 右侧“全部已读”文字按钮；每条通知左侧圆形图标、标题、灰色时间，未读条目浅橘底 + 左侧 6px 品牌色圆点；点击条目变已读并让角标数字 -1，归零时角标缩小消失。"

<div class="nc">
  <button class="bell" aria-label="通知">🔔<b>3</b></button>
  <div class="panel open">
    <header><b>通知</b><button class="all">全部已读</button></header>
    <ul>
      <li class="new"><i style="background:#FFEDD5">♥</i><p>林一舟 赞了你的作品<small>2 分钟前</small></p></li>
      <li class="new"><i style="background:#DBEAFE">✎</i><p>苏白 评论：“这个配色绝了”<small>18 分钟前</small></p></li>
      <li class="new"><i style="background:#DCFCE7">✓</i><p>你的组件已通过审核<small>1 小时前</small></p></li>
      <li><i style="background:#F4F4F5">★</i><p>本周新增 12 个术语<small>昨天</small></p></li>
    </ul>
  </div>
</div>

<style>
.nc { position: relative; width: 290px; height: 300px; }
.bell { position: absolute; right: 4px; top: 0; width: 40px; height: 40px; border-radius: 12px; border: 1px solid #E4E4E7; background: #fff; font-size: 17px; cursor: pointer; }
.bell b { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: #EF4444; color: #fff; font-size: 11px; line-height: 18px; border: 2px solid #FAFAFA; transition: transform .25s cubic-bezier(.34,1.6,.64,1); }
.bell b.zero { transform: scale(0); }
.panel { position: absolute; top: 50px; right: 0; width: 280px; background: #fff; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.12); opacity: 0; transform: translateY(-8px); pointer-events: none; transition: all .2s ease-out; overflow: hidden; }
.panel.open { opacity: 1; transform: none; pointer-events: auto; }
header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; font-size: 14px; }
.all { border: 0; background: none; color: #FA8C16; font-size: 12px; cursor: pointer; }
ul { margin: 0; padding: 0 6px 6px; list-style: none; }
li { position: relative; display: flex; gap: 10px; padding: 8px 10px 8px 16px; border-radius: 10px; cursor: pointer; transition: background .25s; }
li:hover { background: #FAFAFA; } li.new { background: #FFF7ED; }
li.new::before { content: ""; position: absolute; left: 5px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: #FA8C16; }
li i { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; }
li p { margin: 0; font-size: 12px; line-height: 1.4; } li small { display: block; color: #A1A1AA; font-size: 11px; }
</style>
<script>
const badge = document.querySelector(".bell b"), panel = document.querySelector(".panel");
const sync = () => { const n = document.querySelectorAll("li.new").length; badge.textContent = n; badge.classList.toggle("zero", !n); };
document.querySelectorAll("li").forEach((li) => li.addEventListener("click", () => { li.classList.remove("new"); sync(); }));
document.querySelector(".all").addEventListener("click", () => { document.querySelectorAll("li.new").forEach((li) => li.classList.remove("new")); sync(); });
document.querySelector(".bell").addEventListener("click", () => panel.classList.toggle("open"));
</script>
