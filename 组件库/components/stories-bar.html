{
  "en": "Stories Progress Bar", "zh": "故事进度条",
  "lead": "全屏图片轮播顶部的一排小细条，每条代表一页，当前那条慢慢填满，满了自动翻到下一页。点左右两边可以前后翻，按住就暂停。",
  "vague": ["像短视频那样一页页翻", "顶部那排小进度条"],
  "terms": ["Stories", "Segmented Progress 分段进度", "Tap to Advance"],
  "prompt": "做 Stories 式轮播：顶部按页数分段的 2px 进度条（间距 4px、白色 35% 透明），当前段 5 秒线性填满后自动翻页；点击左 1/3 返回上一页、右 2/3 下一页；按住时暂停、松开继续；页面切换时内容淡入；开启 prefers-reduced-motion 时不自动翻页。"
}
-->
<div class="story">
  <div class="bars"></div>
  <div class="slide"></div>
</div>

<style>
.story { position: relative; width: 200px; height: 320px; border-radius: 16px; overflow: hidden; background: #0F1218; color: #fff; user-select: none; cursor: pointer; }
.bars { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 4px; z-index: 1; }
.bars i { flex: 1; height: 2px; border-radius: 2px; background: rgba(255,255,255,.35); overflow: hidden; }
.bars b { display: block; height: 100%; width: 0; background: #fff; }
.slide { position: absolute; inset: 0; display: grid; align-content: end; padding: 22px 18px; animation: in .35s ease-out; }
@keyframes in { from { opacity: 0; } }
.slide h4 { margin: 0 0 4px; font: 700 20px "Songti SC", serif; } .slide p { margin: 0; font-size: 12px; opacity: .75; }
.slide .art { position: absolute; top: 60px; left: 50%; width: 80px; height: 80px; margin-left: -40px; border-radius: 50%; }
</style>

<script>
const pages = [["月出东山", "第一页：故事从江边开始", "radial-gradient(circle at 35% 35%,#FFF4D6,#FFD58A 60%,#FA8C16)", "#1E2A44"],
  ["白露横江", "第二页：雾气从水面升起", "radial-gradient(circle,#E0F2FE,#7DD3FC)", "#0C4A6E"],
  ["渔火点点", "第三页：船灯一盏盏亮起", "radial-gradient(circle,#FED7AA,#EA580C)", "#3B0F0F"]];
const DUR = 5000, story = document.querySelector(".story"), slide = story.querySelector(".slide"), bars = story.querySelector(".bars");
bars.innerHTML = pages.map(() => "<i><b></b></i>").join("");
let i = 0, t = 0, last = 0, paused = false;
function show(n) {
  i = (n + pages.length) % pages.length; t = 0;
  const [h, p, art, bg] = pages[i];
  story.style.background = `linear-gradient(180deg, ${bg}, #0F1218)`;
  slide.innerHTML = `<span class="art" style="background:${art}"></span><h4>${h}</h4><p>${p}</p>`;
  slide.style.animation = "none"; slide.offsetWidth; slide.style.animation = "";
  bars.querySelectorAll("b").forEach((b, k) => (b.style.width = k < i ? "100%" : "0"));
}
function frame(now) {
  if (!paused && last) { t += now - last; if (t >= DUR) show(i + 1); }
  last = now; bars.children[i].firstChild.style.width = (t / DUR) * 100 + "%";
  requestAnimationFrame(frame);
}
story.addEventListener("pointerdown", () => (paused = true));
story.addEventListener("pointerup", (e) => { paused = false; const b = story.getBoundingClientRect(); show(e.clientX - b.left < b.width / 3 ? i - 1 : i + 1); });
story.addEventListener("pointerleave", () => (paused = false));
if (matchMedia("(prefers-reduced-motion: reduce)").matches) paused = true;
show(0); requestAnimationFrame(frame);
</script>
