<!--
{
  "en": "Password Strength Meter",
  "zh": "密码强度条",
  "lead": "边输入边告诉你密码够不够安全：长度、数字、大写、符号，满足越多条越长、颜色越绿。",
  "prompt": "密码框下方加 Password Strength Meter：4 段进度条，按长度≥8、含数字、含大写、含符号计分，弱=红、中=橙、强=绿，旁边写“弱/中/强”，并列出未满足的规则。"
}
-->
<div class="pw">
  <input type="text" value="" placeholder="输入密码试试" />
  <div class="bars"><i></i><i></i><i></i><i></i></div>
  <div class="hint"><b>强度：</b><span class="lv">—</span></div>
  <ul class="rules"><li data-r="len">至少 8 位</li><li data-r="num">包含数字</li><li data-r="up">包含大写字母</li><li data-r="sym">包含符号</li></ul>
</div>

<style>
.pw { width: min(280px, 86vw); font-size: 13px; }
.pw input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 14px; border: 1.5px solid #D4D4D8; border-radius: 10px; font-size: 15px; outline: none; }
.pw input:focus { border-color: #18181B; }
.bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 8px; }
.bars i { height: 5px; border-radius: 3px; background: #E4E4E7; transition: background .3s; }
.hint { color: #52525B; }
.rules { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; color: #A1A1AA; }
.rules li::before { content: "○ "; }
.rules li.ok { color: #16A34A; } .rules li.ok::before { content: "✓ "; }
</style>
<script>
const input = document.querySelector(".pw input"), bars = document.querySelectorAll(".bars i"), lv = document.querySelector(".lv");
const tests = { len: v => v.length >= 8, num: v => /\d/.test(v), up: v => /[A-Z]/.test(v), sym: v => /[^\w]/.test(v) };
const colors = ["#EF4444", "#F59E0B", "#F59E0B", "#16A34A"], names = ["弱", "中", "中", "强"];
function check() {
  const v = input.value; let score = 0;
  document.querySelectorAll(".rules li").forEach(li => { const ok = tests[li.dataset.r](v); li.classList.toggle("ok", ok); score += ok; });
  bars.forEach((b, i) => b.style.background = i < score ? colors[score - 1] : "#E4E4E7");
  lv.textContent = v ? names[Math.max(score - 1, 0)] : "—"; lv.style.color = v ? colors[Math.max(score - 1, 0)] : "";
}
input.addEventListener("input", check);
// 演示：自动输入一个越来越强的密码
const demo = "jiangyue2026!".replace("j", "J"); let i = 0;
const timer = setInterval(() => { input.value = demo.slice(0, ++i); check(); if (i >= demo.length) clearInterval(timer); }, 160);
</script>
