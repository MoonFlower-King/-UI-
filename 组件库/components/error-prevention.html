<div class="card">
  <h4>删除项目「江月官网」</h4>
  <p>此操作不可恢复，所有作品和评论都会被删除。请输入项目名确认：</p>
  <input placeholder="江月官网" aria-label="输入项目名确认删除">
  <button disabled>我明白后果，删除</button>
</div>

<style>
.card { width: 290px; padding: 18px; background: #fff; border: 1px solid #FECACA; border-radius: 14px; display: grid; gap: 10px; }
h4 { margin: 0; font-size: 15px; color: #B91C1C; } p { margin: 0; font-size: 12px; line-height: 1.6; color: #52525B; }
input { height: 38px; padding: 0 12px; border: 1px solid #E4E4E7; border-radius: 9px; font-size: 14px; outline: 0; transition: .15s; }
input:focus { border-color: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,.12); }
button { height: 38px; border: 0; border-radius: 9px; background: #EF4444; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
button:disabled { opacity: .35; cursor: not-allowed; }
</style>

<script>
const input = document.querySelector("input"), btn = document.querySelector("button");
input.addEventListener("input", () => (btn.disabled = input.value.trim() !== "江月官网"));
btn.addEventListener("click", () => { btn.textContent = "已删除（演示）"; setTimeout(() => { btn.textContent = "我明白后果，删除"; input.value = ""; btn.disabled = true; }, 1500); });
</script>
