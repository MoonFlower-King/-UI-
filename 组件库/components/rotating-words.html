<h1 class="rw">写给<span class="slot"><b>设计师</b></span>的<br>界面词典</h1>

<style>
.rw { margin: 0; font: 600 30px/1.4 "Songti SC", Georgia, serif; text-align: center; }
.slot { display: inline-block; position: relative; vertical-align: bottom; height: 1.4em; overflow: hidden; color: #FA8C16; transition: width .3s cubic-bezier(.2,.8,.2,1); padding: 0 .15em; }
.slot b { position: absolute; left: .15em; top: 0; white-space: nowrap; font-weight: 700; transition: transform .4s cubic-bezier(.2,.8,.2,1), opacity .4s; }
.slot b.out { transform: translateY(-100%); opacity: 0; } .slot b.in { transform: translateY(100%); opacity: 0; }
.slot::after { content: ""; position: absolute; left: .15em; right: .15em; bottom: .12em; height: .12em; background: #FED7AA; z-index: -1; border-radius: 2px; }
</style>
<script>
const words = ["设计师", "开发者", "产品经理", "每个人"], slot = document.querySelector(".slot"); let i = 0;
const measure = (w) => { const m = document.createElement("b"); m.textContent = w; m.style.visibility = "hidden"; slot.append(m); const v = m.offsetWidth; m.remove(); return v; };
slot.style.width = measure(words[0]) + "px";
setInterval(() => {
  const old = slot.querySelector("b:not(.out)"); i = (i + 1) % words.length;
  const nb = document.createElement("b"); nb.textContent = words[i]; nb.className = "in"; slot.append(nb);
  slot.style.width = measure(words[i]) + "px"; nb.offsetWidth; nb.className = ""; old.className = "out"; setTimeout(() => old.remove(), 400);
}, 2000);
</script>
