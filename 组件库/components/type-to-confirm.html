  "vague": ["怕用户误删重要的东西", "确认弹窗大家都是直接点掉"],

<div class="dlg">
  <h3>删除项目</h3>
  <p class="warn">项目里的页面、图片和访问记录都会被永久删除，无法恢复。</p>
  <label>请输入 <code>moon-site</code> 以确认</label>
  <input spellcheck="false" autocomplete="off">
  <footer><button class="no">取消</button><button class="yes" disabled>永久删除</button></footer>
</div>
<style>
.dlg { width: 280px; padding: 18px; background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.14), 0 0 0 1px #F0F0F2; font: 13px -apple-system, "PingFang SC", sans-serif; }
h3 { margin: 0 0 8px; font-size: 16px; color: #18181B; }
.warn { margin: 0 0 14px; padding: 8px 10px; border-radius: 8px; background: #FEF2F2; color: #B91C1C; font-size: 12px; line-height: 1.6; }
label { display: block; margin-bottom: 6px; color: #52525B; font-size: 12px; }
code { padding: 1px 5px; border-radius: 4px; background: #F4F4F5; color: #18181B; font: 12px ui-monospace, Menlo, monospace; }
input { box-sizing: border-box; width: 100%; height: 36px; padding: 0 10px; border: 1px solid #E4E4E7; border-radius: 10px; font: 13px ui-monospace, Menlo, monospace; outline: none; }
input:focus { border-color: #EF4444; box-shadow: 0 0 0 3px rgba(239,68,68,.15); }
footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
button { height: 32px; padding: 0 14px; border-radius: 10px; font: inherit; cursor: pointer; border: 1px solid #E4E4E7; background: #fff; }
.yes { border: 0; background: #DC2626; color: #fff; font-weight: 600; transition: opacity .2s; } .yes:disabled { opacity: .4; cursor: not-allowed; }
</style>
<script>
const input = document.querySelector("input"), yes = document.querySelector(".yes");
input.addEventListener("input", () => { yes.disabled = input.value.trim() !== "moon-site"; });
yes.addEventListener("click", () => { yes.textContent = "已删除"; setTimeout(() => { yes.textContent = "永久删除"; input.value = ""; yes.disabled = true; }, 1200); });
document.querySelector(".no").addEventListener("click", () => { input.value = ""; yes.disabled = true; });
</script>
