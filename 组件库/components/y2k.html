<div class="y2k">

<style>
.y2k { position: relative; width: 240px; padding: 28px 20px; border-radius: 24px; text-align: center;
  background: linear-gradient(135deg, #FFC2F4, #B8E6FF, #D5C2FF, #FFC2F4); background-size: 300% 300%; animation: holo 6s ease infinite; }
.y2k h2 { margin: 0 0 14px; font: 900 34px/1 "Arial Black", sans-serif; letter-spacing: 2px;
  background: linear-gradient(#fff, #9aa3b5 50%, #fff 52%, #c9d0dc); -webkit-background-clip: text; background-clip: text; color: transparent;

.y2k button { border: 2px solid #fff; border-radius: 99px; padding: 8px 18px; font-weight: 800; color: #fff; cursor: pointer;

.star { position: absolute; color: #fff; font-size: 22px; animation: twinkle 1.6s ease-in-out infinite; }

</style>
