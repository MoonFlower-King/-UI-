<button class="ripple-btn">立即开始</button>

<style>
.ripple-btn { position: relative; overflow: hidden; border: 0; padding: 14px 32px;
  border-radius: 12px; background: #FA8C16; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.ripple-btn .wave { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .35);
  transform: scale(0); animation: ripple .6s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
</style>

<script>
document.querySelectorAll(".ripple-btn").forEach(btn => btn.addEventListener("click", e => {
  const r = btn.getBoundingClientRect();
  const size = Math.hypot(r.width, r.height) * 2;
  const wave = document.createElement("span");
  wave.className = "wave";
  wave.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
  btn.appendChild(wave);
  wave.addEventListener("animationend", () => wave.remove());
}));
</script>
