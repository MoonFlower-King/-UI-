<div class="sp">
  <figure><i class="a"></i><figcaption>普通 ease</figcaption></figure>
  <figure><i class="b"></i><figcaption>Spring</figcaption></figure>
</div>

<style>
.sp { display: flex; gap: 40px; cursor: pointer; } .sp figure { margin: 0; display: grid; gap: 12px; justify-items: center; }
.sp figcaption { font-size: 12px; color: #71717A; }
.sp i { width: 70px; height: 70px; border-radius: 20px; transform: scale(.4); }
.a { background: #A1A1AA; transition: transform .45s ease; } .b { background: #FA8C16; transition: transform .45s cubic-bezier(.34, 1.56, .64, 1); }
.sp.on i { transform: scale(1); }
</style>
<script>
const sp = document.querySelector(".sp"); sp.onclick = () => sp.classList.toggle("on");
setInterval(() => sp.classList.toggle("on"), 1400);
</script>
