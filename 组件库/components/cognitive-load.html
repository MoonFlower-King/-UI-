<div class="cmp">
  <div class="col bad"><small>✗ 一次填 10 项</small><div class="many"></div></div>
  <div class="col good"><small>✓ 分步，每步 3 项</small><div class="steps"><i class="on"></i><i></i><i></i></div><b>1. 基本信息</b><span class="f"></span><span class="f"></span><span class="f"></span><button>下一步</button></div>
</div>

<style>
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 360px; align-items: start; }
.col { padding: 12px; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; display: grid; gap: 6px; }
small { font-size: 11px; font-weight: 600; } .bad small { color: #EF4444; } .good small { color: #16A34A; }
.many { display: grid; gap: 4px; } .many span { height: 14px; border-radius: 4px; border: 1px solid #E4E4E7; }
.steps { display: flex; gap: 4px; } .steps i { flex: 1; height: 3px; border-radius: 2px; background: #E4E4E7; } .steps .on { background: #FA8C16; }
b { font-size: 12px; } .f { height: 24px; border-radius: 6px; border: 1px solid #E4E4E7; }
button { height: 26px; border: 0; border-radius: 7px; background: #FA8C16; color: #fff; font-size: 11px; font-weight: 600; }
</style>

<script>
document.querySelector(".many").innerHTML = "<span></span>".repeat(10);
</script>
