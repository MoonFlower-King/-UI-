<button class="load-btn"><span class="label">提交订单</span><span class="spin"></span><span class="ok">✓ 已提交</span></button>

<style>
.load-btn { position: relative; min-width: 160px; height: 48px; border: 0; border-radius: 12px; background: #18181B;
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .3s; }
.load-btn > span { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity .2s; }
.load-btn .spin, .load-btn .ok { opacity: 0; }
.load-btn .spin::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .3);
  border-top-color: #fff; animation: spin .8s linear infinite; }
.load-btn.loading { cursor: wait; }
.load-btn.loading .label, .load-btn.done .label { opacity: 0; }
.load-btn.loading .spin { opacity: 1; }
.load-btn.done { background: #34C759; }
.load-btn.done .ok { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
document.querySelectorAll(".load-btn").forEach(btn => btn.addEventListener("click", () => {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add("loading");
  // 这里换成你的真实请求
  setTimeout(() => {
    btn.classList.replace("loading", "done");
    setTimeout(() => { btn.classList.remove("done"); btn.disabled = false; }, 1500);
  }, 1600);
}));
</script>
