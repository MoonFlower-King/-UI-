  "en": "Donut Chart", "zh": "环形图",
  "lead": "展示“各部分占整体多少”。比饼图多一个空心，中间正好写总数。类别别超过 5 个，颜色按重要程度从深到浅，悬停某一段时它变粗、中间数字换成这一段的占比。",
  "vague": ["占比图", "饼图"],
  "terms": ["Donut Chart", "Pie Chart 饼图", "Legend 图例", "Part-to-whole 部分与整体"],
  "prompt": "做 Donut Chart：直径 150px、环宽 18px，用 SVG circle 的 stroke-dasharray 画 4 段，段间 2px 空隙，出场时按顺时针依次画出（800ms）；中间显示总数 + 小字说明；悬停某段或右侧图例项时该段环宽加粗到 24px、其余变淡，中间换成该段名称和百分比；图例用圆点 + 名称 + 右对齐百分比。"
}

<div class="dc">
  <div class="ring"><svg viewBox="0 0 160 160"></svg><div class="mid"><b>2,846</b><small>总访客</small></div></div>
  <ul class="legend"></ul>
</div>

<style>
.dc { display: flex; align-items: center; gap: 18px; background: #fff; padding: 16px 18px; border-radius: 14px; border: 1px solid #F0F0F2; }
.ring { position: relative; width: 140px; height: 140px; }
svg { width: 100%; height: 100%; transform: rotate(-90deg); }
circle { fill: none; stroke-width: 18; transition: stroke-width .2s, opacity .2s, stroke-dasharray .9s cubic-bezier(.22,1,.36,1); cursor: pointer; }
.dc.focus circle { opacity: .3; } .dc.focus circle.hl { opacity: 1; stroke-width: 24; }
.mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.mid b { font-size: 22px; font-variant-numeric: tabular-nums; } .mid small { font-size: 11px; color: #71717A; }
.legend { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 12px; min-width: 110px; }
.legend li { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 4px; border-radius: 6px; } .legend li:hover { background: #F4F4F5; }
.legend i { width: 8px; height: 8px; border-radius: 50%; } .legend em { margin-left: auto; font-style: normal; color: #71717A; font-variant-numeric: tabular-nums; }
</style>
<script>
const data = [["搜索", 42, "#FA8C16"], ["抖音", 31, "#FDBA74"], ["直接访问", 17, "#1E3A5F"], ["其他", 10, "#CBD5E1"]];
const svg = document.querySelector("svg"), mid = document.querySelector(".mid"), dc = document.querySelector(".dc"), legend = document.querySelector(".legend");
const C = 2 * Math.PI * 62; let acc = 0; const keep = mid.innerHTML;
data.forEach(([name, p, color], i) => {
  const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  Object.entries({ cx: 80, cy: 80, r: 62, stroke: color, "stroke-dasharray": `0 ${C}`, "stroke-dashoffset": -acc * C / 100 }).forEach(([k, v]) => c.setAttribute(k, v));
  svg.append(c); const len = p * C / 100 - 2; setTimeout(() => c.style.strokeDasharray = `${len} ${C}`, 80 + i * 180); acc += p;
  const li = document.createElement("li"); li.innerHTML = `<i style="background:${color}"></i>${name}<em>${p}%</em>`; legend.append(li);
  const on = () => { dc.classList.add("focus"); c.classList.add("hl"); mid.innerHTML = `<b>${p}%</b><small>${name}</small>`; };
  const off = () => { dc.classList.remove("focus"); c.classList.remove("hl"); mid.innerHTML = keep; };
  [c, li].forEach((el) => { el.addEventListener("mouseenter", on); el.addEventListener("mouseleave", off); });
});
</script>
