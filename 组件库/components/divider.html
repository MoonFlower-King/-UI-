<div class="dv">
  <small>普通</small><hr>
  <small>带文字</small><div class="lab"><span>或</span></div>
  <small>渐隐</small><hr class="fade">
  <small>列表内缩进</small>
  <ul><li>留白</li><li>层次阴影</li><li>毛玻璃</li></ul>
</div>

<style>
.dv { width: 260px; display: grid; gap: 8px; }
small { font-size: 10px; color: #A1A1AA; margin-top: 6px; }
hr { width: 100%; border: 0; height: 1px; background: #E4E4E7; margin: 0; }
.fade { background: linear-gradient(90deg, transparent, #D4D4D8, transparent); }
.lab { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #A1A1AA; } .lab::before, .lab::after { content: ""; flex: 1; height: 1px; background: #E4E4E7; }
ul { margin: 0; padding: 0; list-style: none; background: #fff; border-radius: 12px; border: 1px solid #F0F0F2; }
li { position: relative; padding: 10px 16px; font-size: 13px; } li + li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: #F0F0F2; }
</style>
