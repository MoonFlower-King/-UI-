  "en": "Description List", "zh": "详情列表",
  "lead": "左边是字段名、右边是内容，一行一条，用来展示订单详情、个人资料这类“键值对”信息。比随手堆几段文字整齐得多。",
  "vague": ["详情页好乱", "信息一条一条怎么排"],
  "terms": ["Description List", "Key-Value 键值对", "dl / dt / dd"],
  "prompt": "订单详情用 Description List（dl/dt/dd）：两列网格，左列字段名 13px 灰色 #71717A 固定 88px 宽，右列内容 14px 深色左对齐；行与行之间 1px #F4F4F5 分隔线、上下内边距 12px；订单号这类可复制的值后面放一个复制小图标；手机上改成上下排列。"
}

<div class="card">
  <h3>订单详情</h3>
  <dl>
    <dt>订单号</dt><dd><code>JY20261102</code><button aria-label="复制订单号">⧉</button></dd>
    <dt>状态</dt><dd><span class="badge">已发货</span></dd>
    <dt>商品</dt><dd>月白陶瓷马克杯 × 2</dd>
    <dt>收货地址</dt><dd>江边路 18 号 · 望月小区 3 栋</dd>
    <dt>实付</dt><dd><b>¥ 138.00</b></dd>
  </dl>
</div>

<style>
.card { width: 320px; padding: 18px 20px 6px; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; }
h3 { margin: 0 0 6px; font-size: 15px; color: #18181B; }
dl { display: grid; grid-template-columns: 76px 1fr; margin: 0; }
dt, dd { margin: 0; padding: 11px 0; border-top: 1px solid #F4F4F5; font-size: 13px; }
dt { color: #71717A; } dd { color: #18181B; display: flex; align-items: center; gap: 6px; min-width: 0; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
button { border: 0; background: none; color: #A1A1AA; cursor: pointer; font-size: 13px; padding: 0 4px; border-radius: 4px; }
button:hover { color: #FA8C16; background: #FFF4E6; }
.badge { padding: 2px 8px; border-radius: 999px; background: #DCFCE7; color: #15803D; font-size: 12px; }
b { font-size: 15px; }
@media (max-width: 360px) { dl { grid-template-columns: 1fr; } dd { border-top: 0; padding-top: 0; } }
</style>

<script>
const btn = document.querySelector("button");
btn.addEventListener("click", () => {
  navigator.clipboard?.writeText("JY20261102").catch(() => {});
  btn.textContent = "✓"; setTimeout(() => (btn.textContent = "⧉"), 1200);
});
</script>
