<div class="card">
  <div class="wheel"><i style="--a:30deg;--c:#FA8C16"></i><i style="--a:180deg;--c:#14B8A6"></i><i style="--a:240deg;--c:#6366F1"></i><span></span></div>
  <ul>
    <li><b style="background:#FA8C16"></b>主色 30°</li>
    <li><b style="background:#14B8A6"></b>强调 180°</li>
    <li><b style="background:#6366F1"></b>强调 240°</li>
  </ul>
</div>
<style>
.card { display: flex; align-items: center; gap: 20px; width: 300px; padding: 18px; background: #fff; border: 1px solid #E4E4E7; border-radius: 14px; }
.wheel { position: relative; flex: none; width: 120px; height: 120px; border-radius: 50%;
  background: conic-gradient(from 90deg, hsl(0 85% 60%), hsl(60 85% 55%), hsl(120 70% 50%), hsl(180 70% 45%), hsl(240 75% 62%), hsl(300 70% 60%), hsl(360 85% 60%));
  -webkit-mask: radial-gradient(circle, transparent 34px, #000 35px); mask: radial-gradient(circle, transparent 34px, #000 35px); }
.wheel i { position: absolute; left: 50%; top: 50%; width: 60px; height: 3px; margin-top: -1.5px; transform-origin: 0 50%; transform: rotate(calc(var(--a) - 90deg)); }
.wheel i::after { content: ""; position: absolute; right: -4px; top: -6px; width: 15px; height: 15px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
ul { margin: 0; padding: 0; list-style: none; font-size: 12px; color: #3F3F46; }
li { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
li b { width: 22px; height: 14px; border-radius: 4px; }
li:first-child b { width: 40px; }
</style>
