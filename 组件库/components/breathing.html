<div class="br"><div class="c"><i></i><i></i><i></i></div><b>吸气</b></div>
<style>
.br { position: relative; width: 300px; height: 260px; display: grid; place-items: center; border-radius: 14px; background: radial-gradient(circle at 50% 40%, #1E2A4A, #0B1020 75%); overflow: hidden; }
.c { position: relative; width: 160px; height: 160px; }
.c i { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(250,173,20,.55), rgba(250,140,22,.15) 70%); animation: b 8s ease-in-out infinite; }
.c i:nth-child(2) { inset: 18px; animation-delay: .3s; background: radial-gradient(circle, rgba(255,214,145,.7), rgba(250,140,22,.25) 70%); }
.c i:nth-child(3) { inset: 40px; animation-delay: .6s; background: radial-gradient(circle, #FFF4E0, #FAAD14); }
@keyframes b { 0%, 100% { transform: scale(.7); opacity: .6; } 50% { transform: scale(1); opacity: 1; } }
b { position: absolute; font: 600 16px "Songti SC","Noto Serif SC",serif; letter-spacing: .3em; color: #3A2410; transition: opacity .6s; }
@media (prefers-reduced-motion: reduce) { @keyframes b { 0%, 100% { opacity: .5; } 50% { opacity: 1; } } }
</style>
<script>
const t = document.querySelector("b"); let inhale = true;
setInterval(() => { t.style.opacity = 0; setTimeout(() => { inhale = !inhale; t.textContent = inhale ? "吸气" : "呼气"; t.style.opacity = 1; }, 600); }, 4000);
</script>
