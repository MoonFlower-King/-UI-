<div class="ot">
  <p class="solid">MOON</p>
  <p class="hollow" data-t="LIGHT">LIGHT</p>
  <p class="hollow" data-t="RIVER">RIVER</p>
</div>

<style>
.ot { display: grid; justify-items: center; line-height: .95; }
.ot p { margin: 0; font: 900 64px/1 "Arial Black", Impact, -apple-system, sans-serif; letter-spacing: .02em; }
.solid { color: #18181B; }
.hollow { position: relative; color: transparent; -webkit-text-stroke: 1.5px #18181B; cursor: default; }
.hollow::after { content: attr(data-t); position: absolute; inset: 0; color: #FA8C16; -webkit-text-stroke: 0; clip-path: inset(0 100% 0 0); transition: clip-path .6s ease-out; }
.hollow:hover::after { clip-path: inset(0 0 0 0); }
</style>
