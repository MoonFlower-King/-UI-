<!--
{
  "en": "Password Visibility Toggle", "zh": "显示 / 隐藏密码",
  "lead": "密码框右边一个小眼睛，点一下就能看到自己输了什么，再点一下藏回去。手机上打字容易错，有了它能少很多“密码错误”。",
  "vague": ["看不到输了什么密码", "小眼睛图标"],
  "terms": ["Password Toggle", "Show / Hide Password", "Reveal"],
  "prompt": "密码框加 Visibility Toggle：输入框右侧内嵌 32px 眼睛图标按钮，点击在 type=password 和 text 之间切换，图标在睁眼/闭眼（带斜线）间切换；切换后焦点和光标位置保持不变；按钮写 aria-label“显示密码 / 隐藏密码”和 aria-pressed。"
}
-->
<label class="f">密码
  <span class="in"><input type="password" value="moon-river-2026" autocomplete="current-password"><button type="button" aria-label="显示密码" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></span>
</label>

<style>
.f { display: grid; gap: 6px; width: 280px; font-size: 12px; font-weight: 500; color: #52525B; }
.in { position: relative; }
input { width: 100%; box-sizing: border-box; height: 42px; padding: 0 44px 0 12px; border: 1px solid #E4E4E7; border-radius: 10px; font-size: 15px; letter-spacing: .04em; outline: 0; transition: .15s; }
input:focus { border-color: #FA8C16; box-shadow: 0 0 0 3px rgba(250,140,22,.15); }
button { position: absolute; right: 5px; top: 5px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: #71717A; cursor: pointer; display: grid; place-items: center; }
button:hover { background: #F4F4F5; color: #18181B; }
svg { width: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
.slash { transition: stroke-dashoffset .2s; stroke-dasharray: 23; stroke-dashoffset: 0; }
button[aria-pressed="true"] .slash { stroke-dashoffset: 23; }
</style>

<script>
const input = document.querySelector("input"), btn = document.querySelector("button");
btn.addEventListener("click", () => {
  const show = input.type === "password", pos = input.selectionStart;
  input.type = show ? "text" : "password";
  btn.setAttribute("aria-pressed", show); btn.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
  input.focus(); input.setSelectionRange(pos, pos);
});
</script>
