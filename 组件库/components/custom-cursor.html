<div class="stage">
  <h2>江上明月</h2>
  <div class="links"><a href="#">作品</a><a href="#">关于</a><button>联系我</button></div>
  <i class="dot"></i><i class="ring"></i>
</div>

<style>
.stage { position: relative; width: 340px; height: 240px; border-radius: 18px; background: #0B1426; color: #F5EFE6; display: grid; place-content: center; text-align: center; gap: 16px; cursor: none; overflow: hidden; }
.stage * { cursor: none; }
h2 { margin: 0; font: 600 28px "Songti SC", Georgia, serif; letter-spacing: .1em; }
.links { display: flex; gap: 14px; justify-content: center; align-items: center; }
a { color: #CBD5E1; text-decoration: none; font-size: 14px; } button { border: 0; background: #FA8C16; color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; }
.dot, .ring { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; }
.dot { width: 8px; height: 8px; margin: -4px; background: #FA8C16; transition: opacity .2s; }
.ring { width: 36px; height: 36px; margin: -18px; border: 1.5px solid rgba(253,230,138,.7); transition: width .25s, height .25s, margin .25s, background .25s, border-color .25s, scale .15s; }
.stage.hot .ring { width: 64px; height: 64px; margin: -32px; background: rgba(250,140,22,.15); border-color: #FA8C16; } .stage.hot .dot { opacity: 0; }
.stage.down .ring { scale: .8; }
</style>
<script>
const st = document.querySelector(".stage"), dot = st.querySelector(".dot"), ring = st.querySelector(".ring");
let mx = 170, my = 120, rx = mx, ry = my;
st.addEventListener("mousemove", (e) => { const r = st.getBoundingClientRect(); mx = e.clientX - r.left; my = e.clientY - r.top; dot.style.transform = `translate(${mx}px,${my}px)`; st.classList.toggle("hot", !!e.target.closest("a,button")); });
st.addEventListener("mousedown", () => st.classList.add("down")); addEventListener("mouseup", () => st.classList.remove("down"));
(function loop() { rx += (mx - rx) * .15; ry += (my - ry) * .15; ring.style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); })();
dot.style.transform = `translate(${mx}px,${my}px)`;
</script>
