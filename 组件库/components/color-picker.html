{
  "en": "Color Picker", "zh": "颜色选择器",
  "lead": "一块饱和度/明度面板 + 一条色相滑条 + 一个十六进制输入框，再配一排常用色板。拖动时预览色块和色值实时变化。",
  "vague": ["选颜色的控件", "调色板"],
  "terms": ["Color Picker", "Hue Slider 色相条", "Saturation Panel 饱和度面板", "Swatches 色板"],
  "prompt": "做 Color Picker：上方 200×120px 饱和度/明度面板（白→纯色横向渐变叠加透明→黑纵向渐变），圆形 14px 白边取色点可拖动；下方 10px 高圆角彩虹色相滑条；再下方左边 28px 圆形当前色预览 + HEX 输入框（等宽字体）；底部一排 6 个预设色板，点击切换，选中的外圈描边。"
}
-->
<div class="cp">
  <div class="sv"><i class="dot"></i></div>
  <input class="hue" type="range" min="0" max="360" value="30">
  <div class="out"><span class="sw"></span><code>#FA8C16</code></div>
  <div class="presets"></div>
</div>

<style>
.cp { width: 220px; padding: 12px; background: #fff; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 28px rgba(0,0,0,.08); display: grid; gap: 10px; }
.sv { position: relative; height: 120px; border-radius: 8px; background: linear-gradient(transparent, #000), linear-gradient(90deg, #fff, hsl(var(--h, 30), 100%, 50%)); cursor: crosshair; touch-action: none; }
.dot { position: absolute; width: 14px; height: 14px; margin: -7px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 2px 4px rgba(0,0,0,.3); pointer-events: none; }
.hue { appearance: none; width: 100%; height: 10px; border-radius: 5px; margin: 0; background: linear-gradient(90deg, red, #ff0, lime, cyan, blue, #f0f, red); cursor: pointer; }
.hue::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 1px 3px rgba(0,0,0,.3); }
.out { display: flex; align-items: center; gap: 10px; } .sw { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
code { flex: 1; padding: 6px 10px; border: 1px solid #E4E4E7; border-radius: 8px; font: 13px ui-monospace, Menlo, monospace; }
.presets { display: flex; justify-content: space-between; }
.presets button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #E4E4E7; cursor: pointer; transition: transform .15s; }
.presets button:hover { transform: scale(1.12); } .presets button.on { box-shadow: 0 0 0 2px #18181B; }
</style>
<script>
const sv = document.querySelector(".sv"), dot = sv.querySelector(".dot"), hue = document.querySelector(".hue"), sw = document.querySelector(".sw"), code = document.querySelector("code");
let h = 30, s = .91, v = .98;
const hex = () => { const f = (n) => { const k = (n + h / 60) % 6; return Math.round(255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1)))); }; return "#" + [f(5), f(3), f(1)].map((x) => x.toString(16).padStart(2, "0")).join("").toUpperCase(); };
const paint = () => { sv.style.setProperty("--h", h); hue.value = h; dot.style.left = s * 100 + "%"; dot.style.top = (1 - v) * 100 + "%"; const c = hex(); sw.style.background = dot.style.background = c; code.textContent = c; };
hue.addEventListener("input", () => { h = +hue.value; paint(); });
sv.addEventListener("pointerdown", (e) => {
  const move = (ev) => { const r = sv.getBoundingClientRect(); s = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)); v = 1 - Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height)); paint(); };
  move(e); const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
});
const presets = document.querySelector(".presets");
[[30, .91, .98], [0, .7, .9], [145, .7, .7], [212, .75, .9], [270, .55, .85], [0, 0, .1]].forEach((p) => {
  const b = document.createElement("button"); ({ 0: h, 1: s, 2: v } = p); b.style.background = hex(); b.ariaLabel = hex();
  b.addEventListener("click", () => { [h, s, v] = p; paint(); presets.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); }); presets.append(b);
});
[h, s, v] = [30, .91, .98]; paint();
</script>
