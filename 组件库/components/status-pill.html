<ul class="list">
  <li><span>首页改版</span><em class="st run">进行中</em></li>
  <li><span>配色规范</span><em class="st done">已完成</em></li>
  <li><span>动效文档</span><em class="st pause">已暂停</em></li>
  <li><span>图标导出</span><em class="st fail">失败</em></li>
</ul>

<style>
.list { width: 280px; margin: 0; padding: 6px 14px; list-style: none; background: #fff; border: 1px solid #E4E4E7; border-radius: 12px; }
li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 13px; color: #18181B; }
li + li { border-top: 1px solid #F4F4F5; }
.st { --c: #71717A; --bg: #F4F4F5; --tx: #52525B; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--bg); color: var(--tx); font: normal 600 12px sans-serif; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.run { --c: #2563EB; --bg: #EFF6FF; --tx: #1D4ED8; } .run::before { animation: pulse 1.6s infinite; box-shadow: 0 0 0 0 rgba(37,99,235,.5); }
.done { --c: #16A34A; --bg: #F0FDF4; --tx: #15803D; } .fail { --c: #DC2626; --bg: #FEF2F2; --tx: #B91C1C; }
@keyframes pulse { to { box-shadow: 0 0 0 5px rgba(37,99,235,0); } }
</style>
