<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>江月 UI</title>
  <!-- 江月 UI 原创标志「半月倒影」：半轮明月浮在江面，下面三道倒影渐短渐淡。CC0 以外请随仓库许可证使用 -->
  <defs><linearGradient id="jy-moon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FA8C16"/></linearGradient></defs>
  <path d="M12 34a20 20 0 0 1 40 0z" fill="url(#jy-moon)"/>
  <g stroke="#FA8C16" stroke-width="4.5" stroke-linecap="round">
    <path d="M14 42h36" opacity=".85"/>
    <path d="M20 50h24" opacity=".6"/>
    <path d="M27 58h10" opacity=".35"/>
  </g>
</svg>
