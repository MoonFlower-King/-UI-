# 把「图鉴网站（开源）」发布到 GitHub Pages 根目录，「组件库」发布到 /ui/。
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」。
#
# - 提 PR 时：只跑构建检查（缺组件、元信息写错等会在合并前报红），不发布。
# - 合并到 main 时：构建并发布。
# 生成的数据文件不入库，每次都在这里重新生成。
name: 构建并发布图鉴网站与组件库
on:
  push:
    branches: [main]
    paths: ['EP*/**', '图鉴网站（开源）/**', '组件库/**', 'package.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['EP*/**', '图鉴网站（开源）/**', '组件库/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成组件库与图鉴数据
        run: npm run build
      - name: 组装站点
        run: |
          mkdir -p _site/ui
          cp -r "图鉴网站（开源）/." _site/
          cp -r 组件库/. _site/ui/
          rm -f _site/.gitignore _site/ui/.gitignore
          # 源文件和构建脚本只在构建时用，网页运行时用不到，不上传（发布包小一半多）
          rm -rf _site/scripts _site/episodes.json _site/ui/scripts _site/ui/components _site/ui/prompts _site/ui/admin _site/ui/data/*.json
          # 页面引用的本地脚本和样式加上 ?v=提交号：刚发布完浏览器不会拿缓存里的旧文件配新数据（按需下载的数据文件由 common.js 带上同一个版本号）
          v=${GITHUB_SHA::7}
          find _site -name '*.html' -not -path '*/demos/*' -not -path '*/episodes/*' -exec sed -i -E "s#(src|href)=\"((assets|data)/[^\"?]+\.(js|css))\"#\1=\"\2?v=$v\"#g" {} +
          grep -ho '[a-z]*\.\(js\|css\)?v=[0-9a-f]*' _site/index.html _site/ui/*.html
          du -sh _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
