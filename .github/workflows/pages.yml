# 把「图鉴网站（开源）」发布到 GitHub Pages。
# 首次使用：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」。
name: 发布图鉴网站
on:
  push:
    branches: [main]
    paths: ['图鉴网站（开源）/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成词条数据
        run: node "图鉴网站（开源）/scripts/build.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 图鉴网站（开源）
      - id: deployment
        uses: actions/deploy-pages@v4
